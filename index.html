<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--radius:.625rem;--radius-sm:calc(var(--radius) - 4px);--radius-md:calc(var(--radius) - 2px);
--background:oklch(1 0 0);--foreground:oklch(0.129 0.042 264.695);--card:oklch(1 0 0);
--primary:oklch(0.46 0.2 293);--primary-foreground:oklch(0.985 0 0);
--secondary:oklch(0.968 0.007 247.896);--muted-foreground:oklch(0.554 0.046 257.417);
--destructive:oklch(0.577 0.245 27.325);--border:oklch(0.929 0.013 255.508);--input:oklch(0.929 0.013 255.508);--ring:oklch(0.704 0.04 256.788);
--font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--font-read:var(--font-ui);--font-pen:var(--font-ui);}
:root{--page:var(--background);--sheet:var(--card);--sheet-2:var(--secondary);--ink:var(--foreground);--soft:var(--muted-foreground);--rule:var(--border);--blue:var(--primary);
--blue-2:color-mix(in oklab,var(--primary) 10%,var(--card));--link:color-mix(in oklab,var(--primary) 78%,var(--foreground));--pen:var(--destructive);--pen-2:color-mix(in oklab,var(--destructive) 10%,var(--card));--amber:oklch(0.769 0.188 70.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--background:oklch(0.129 0.042 264.695);--foreground:oklch(0.984 0.003 247.858);--card:oklch(0.208 0.042 265.755);--primary:oklch(0.66 0.19 293);--primary-foreground:oklch(0.985 0 0);--secondary:oklch(0.279 0.041 260.031);--muted-foreground:oklch(0.704 0.04 256.788);--destructive:oklch(0.704 0.191 22.216);--border:oklch(1 0 0/10%);--input:oklch(1 0 0/15%);--ring:oklch(0.551 0.027 264.364)}}
:root[data-theme="dark"]{--background:oklch(0.129 0.042 264.695);--foreground:oklch(0.984 0.003 247.858);--card:oklch(0.208 0.042 265.755);--primary:oklch(0.66 0.19 293);--primary-foreground:oklch(0.985 0 0);--secondary:oklch(0.279 0.041 260.031);--muted-foreground:oklch(0.704 0.04 256.788);--destructive:oklch(0.704 0.191 22.216);--border:oklch(1 0 0/10%);--input:oklch(1 0 0/15%);--ring:oklch(0.551 0.027 264.364)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui);font-size:17px;line-height:1.55}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header.top{padding:34px 0 10px}
header.top .bar{width:64px;height:6px;background:var(--blue);margin-bottom:16px}
h1{font-size:clamp(1.8rem,5.5vw,2.7rem);line-height:1.1;font-weight:400;margin:0 0 8px;letter-spacing:-.01em}
.sub{margin:0;color:var(--soft);max-width:58ch}
.btn{background:var(--sheet);border:1px solid var(--ink);border-radius:3px;padding:7px 16px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--sheet-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:3px 10px;font-weight:400;font-size:.92rem}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:inherit}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;margin:0 0 20px}
.panel>h2{margin:0;padding:14px 20px 10px;font-size:1.3rem;font-weight:400;border-bottom:1px solid var(--rule)}
.panel .in{padding:14px 20px 16px}
.banner{border-left:4px solid var(--blue);background:var(--blue-2);padding:10px 14px;margin:0 0 20px;font-size:.95rem}
.banner.warn{border-left-color:var(--pen);background:var(--pen-2)}
.banner p{margin:0}.banner p+p{margin-top:4px}
.due{margin:0 0 20px}
.due ul{list-style:none;margin:0;padding:0}
.due li{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.due li:first-child{border-top:0}
/* groups */
.gcard{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;margin:0 0 20px}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:14px 20px 10px;border-bottom:1px solid var(--rule)}
.gh h3{margin:0;font-size:1.35rem;font-weight:400}
.gh .no{font-weight:700;color:var(--soft)}
.badge{margin-left:auto;font-family:var(--font-pen);color:var(--pen);font-size:1.6rem;transform:rotate(-3deg);line-height:1}
.badge.mid{color:var(--blue)}
.mode{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;width:max-content;background:var(--sheet)}
.mode button{background:none;border:0;padding:8px 18px;cursor:pointer;font-size:1rem;font-weight:700;color:var(--soft)}
.mode button+button{border-left:1px solid var(--rule)}
.mode button[aria-pressed="true"]{background:var(--blue);color:#fff}
.warnText{color:var(--pen)}
.steps{list-style:none;margin:0;padding:6px 20px}
.steps li{display:grid;grid-template-columns:4.2rem 1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.steps li:first-child{border-top:0}
.steps .day{font-weight:700;color:var(--soft)}
.steps .nm b{font-weight:700}
.steps .st{font-size:.92rem;color:var(--soft)}
.steps li.done .st{color:var(--blue)}
.steps li.ready .st{color:var(--pen);font-weight:700}
.steps li.done .day::after{content:" ✓";color:var(--blue)}
.gf{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 20px 16px;border-top:1px solid var(--rule);font-size:.95rem}
.gf .sp{margin-left:auto}
.verbtable{width:100%;border-collapse:collapse;font-size:.95rem;margin:6px 0}
.verbtable th,.verbtable td{border-bottom:1px solid var(--rule);padding:4px 8px;text-align:left}
.verbtable thead th{color:var(--soft);font-weight:400}
.verbtable td.sv{font-family:var(--font-read);font-size:1.02rem}
details{margin:0 0 12px}details>summary{cursor:pointer;font-weight:700;padding:4px 0}
.scores{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.95rem;margin:0}
.scores b{font-weight:700}
/* settings */
.settings{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:.95rem}
.settings select{background:var(--sheet);border:1px solid var(--ink);border-radius:3px;padding:3px 6px}
/* run */
.stage{background:var(--sheet);border:1px solid var(--ink);border-radius:4px;min-height:min(78vh,560px);display:flex;flex-direction:column;margin:16px 0}
.hud{display:flex;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--rule);font-size:.92rem;color:var(--soft)}
.hud .sp{margin-left:auto}
.sbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:22px 16px 12px;text-align:center;gap:14px}
.en{min-height:2.6em;font-size:clamp(1.4rem,4.6vw,2rem);line-height:1.25}
.en small{display:block;font-size:.8rem;color:var(--soft)}
.center{width:100%;max-width:520px;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.fix{font-size:4.5rem;line-height:1;color:var(--soft);font-weight:300}
.frow{display:grid;grid-template-columns:6.5rem 1fr;align-items:center;gap:10px;padding:8px 14px;border:1px solid transparent;border-radius:4px;text-align:left}
.frow .lb{color:var(--soft);font-size:.9rem}
.frow .w{font-family:var(--font-read);font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.15;min-height:1.15em}
.frow.hidden .w{color:var(--rule)}
.frow.act{border-color:var(--blue);background:var(--blue-2)}
.frow.ask{border-color:var(--pen);background:var(--pen-2)}
.notes{font-size:.88rem;color:var(--soft);max-width:520px;min-height:1.4em}
.prompt{min-height:2.4em;font-size:1.15rem;font-weight:700}
.prompt.say{color:var(--pen)}
.prompt.hear{color:var(--blue)}
.tbar{height:6px;background:var(--rule)}
.tbar i{display:block;height:100%;width:0;background:var(--blue)}
.big{font-family:var(--font-read);font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.1}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px;min-height:6.5rem}
.opt2{border:2px solid var(--ink);background:var(--sheet);border-radius:4px;padding:14px 10px;cursor:pointer;font-size:1.1rem;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.opt2 small{color:var(--soft);font-size:.85rem}
.opt2.sel{border-color:var(--blue);background:var(--blue-2)}
.opt2:hover{background:var(--sheet-2)}
.opt2.sel:hover{background:var(--blue-2)}
.cd{font-size:5rem;font-weight:300;color:var(--soft)}
.res .pen{font-family:var(--font-pen);color:var(--pen);transform:rotate(-3deg);line-height:1;display:inline-block;text-align:center;margin:6px 0 10px}
.res .pen b{display:block;font-size:3.6rem;font-weight:700}
.res .pen svg{display:block;width:100%;height:12px;margin-top:-2px}
.res .pen em{font-style:normal;font-size:1.5rem}
.miss{list-style:none;margin:8px 0 0;padding:0;columns:2 260px;font-size:.95rem}
.miss li{padding:2px 0;break-inside:avoid}
.miss .sv{font-family:var(--font-read)}
.hint{font-size:.9rem;color:var(--soft)}
.paras p{margin:0 0 .6em}
.paras ul{margin:.2em 0 .6em;padding-left:1.2em}
footer.pg{padding:0 0 40px;color:var(--soft);font-size:.88rem}
@media (max-width:560px){body{font-size:16px}.panel>h2,.panel .in,.gh,.steps,.gf{padding-left:14px;padding-right:14px}.steps li{grid-template-columns:3.4rem 1fr}.steps li .act{grid-column:2}.frow{grid-template-columns:5.2rem 1fr}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}

header.top .bar{display:none}
header.top{padding:28px 0 8px}

.tog{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--blue-2);font-size:1rem}
.tog input,.settings input{accent-color:var(--primary);width:18px;height:18px}
.ctl{display:flex;flex-wrap:wrap;gap:8px}.ctl .btn{padding:12px 18px;flex:1 1 auto}
.res .pen{transform:none}


.gh{border-bottom:0;padding-bottom:10px}.gh h3{color:var(--link);font-weight:700}
.seg{display:flex;gap:6px;padding:0 20px 14px;border-bottom:1px solid var(--rule)}
.seg i{flex:1;height:5px;border-radius:3px;background:color-mix(in oklab,var(--foreground) 12%,var(--card))}

.steps li.ready .st{color:var(--pen)}
.cmp>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--rule);cursor:pointer;font-size:.9rem;color:var(--soft);font-weight:400}

.prac .pr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

.ctl2{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ctl2 .btn{padding:12px 18px;flex:1 1 auto}
.btn.mk[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--primary-foreground)}

.mklist{list-style:none;margin:6px 0 0;padding:0;font-size:.95rem}
.mklist li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--rule)}
.mklist li:first-child{border-top:0}

/* ================= dates ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/86400000);
const nice=s=>parse(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

/* ================= plan / progress ================= */
function plan(c,gid){
  const gs=gstate(c,gid);let prev=null;
  return STEPS.map((st,i)=>{
    const rec=gs.steps[st.id];const done=!!(rec&&rec.date);
    const due=done?rec.date:(prev?addDays(prev,st.gap):today());
    prev=due;
    return {st,rec,done,due,i};
  });
}
function availability(c,gid){
  const p=plan(c,gid),t=today();
  return p.map((x,i)=>{
    let priorDone=true;
    for(let j=0;j<i;j++){if(!p[j].done)priorDone=false;}
    x.priorDone=priorDone;
    x.ready=!x.done&&priorDone&&diff(t,x.due)>=0;
    x.blocked=!x.done&&priorDone&&diff(t,x.due)<0;   /* previous steps done, but too early */
    x.early=x.blocked;
    x.late=x.ready?Math.max(0,diff(t,x.due)):0;
    return x;
  });
}
function groupStatus(c,gid){
  const gs=gstate(c,gid),st=gs.steps;
  const trained=['study','r1','r2','r3','r4'].every(k=>st[k]&&st[k].date);
  const final=st.t2&&st.t2.date&&st.t2.pct!=null?st.t2.pct:null;
  return {trained,mastered:final!=null&&final>=MASTER,final};
}

/* ================= test-item construction ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor((rnd||Math.random)()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const testCache={};
function testItems(c,gid){
  const ck=c.key+':'+gid;
  if(testCache[ck])return testCache[ck];
  const vs=itemsOf(c,gById(c,gid)),n=vs.length,nf=c.forms.length,rnd=mulberry32(gid*7919+13+(c.key==='vocab'?9973:(c.key==='noun'?4421:(c.key==='adj'?6133:(c.key==='pv'?2087:(c.key==='sent'?3359:0))))));
  const forms=shuffled(Array.from({length:n},(_,i)=>i%nf),rnd);
  const types=nf>1?shuffled(Array.from({length:n},(_,i)=>i%2),rnd):Array.from({length:n},()=>0);
  const conflicts=i=>{const inf=vs[i][0];const set=new Set([i]);c.conflicts.forEach(cf=>{if(cf.includes(inf))cf.forEach(w=>{const k=vs.findIndex(v=>v[0]===w);if(k>=0)set.add(k);});});return set;};
  const items=vs.map((v,i)=>{
    const f=forms[i];let foil;
    if(types[i]===0){const bad=conflicts(i);const cc=[];for(let j=0;j<n;j++)if(!bad.has(j))cc.push(j);foil={item:cc[Math.floor(rnd()*cc.length)],form:f};}
    else{const alt=[];for(let k=0;k<nf;k++)if(k!==f&&vs[i][k]!==vs[i][f])alt.push(k);
      if(alt.length)foil={item:i,form:alt[Math.floor(rnd()*alt.length)]};
      else{const bad=conflicts(i);const cc=[];for(let j=0;j<n;j++)if(!bad.has(j))cc.push(j);foil={item:cc[Math.floor(rnd()*cc.length)],form:f};types[i]=0;}}
    return {item:i,form:f,foil,foilType:foil.item===i?1:0,leftCorrect:rnd()<0.5};
  });
  testCache[ck]=items;return items;
}
const optLabel=(c,gid,o)=>{const v=itemsOf(c,gById(c,gid))[o.item];return {en:enOf(c,v),tag:c.forms[o.form].label};};

/* ================= pronunciation notes (spelling rules only) ================= */
function notesFor(c,entry){
  const ws=entry.slice(0,c.forms.length).map(w=>w.replace(/^(en|ett) /,'')).flatMap(w=>w.toLowerCase().split(/[\s,.!?]+/).filter(Boolean));
  const rules=[
   [/^gj|^g[eiyäö]/,'g before e, i, y, ä, ö (and gj) is pronounced like English y [j]'],
   [/^k[eiyäö]/,'k before e, i, y, ä, ö is the soft tj-sound [ɕ]'],
   [/^sj/,'sj is the Swedish sj-sound [ɧ], with no English equivalent'],
   [/^hj/,'hj is pronounced like y, the h is silent [j]'],
   [/^för.*rs|^förs/,'rs is pronounced like a single sh-like sound [ʂ]']
  ];
  return rules.map(r=>{const m=[...new Set(ws.filter(w=>r[0].test(w)))];return m.length?r[1]+': '+m.join(', ')+'.':null;}).filter(Boolean);
}

let LP=null;
function say(text,lang){

    if(!S.settings.audio||!window.speechSynthesis){setTimeout(res,900);return;}
    let done=false,tm;const fin=()=>{if(!done){done=true;clearTimeout(tm);res();}};

/* ---- loop focus marks (used only by the loop): 'practice more' items repeat
   extra times per lap; 'I know this' items are left out. Stored in S.marks so
   they sync and travel with the backup code. ---- */
const FOCUS_COPIES=2; /* a practice-more item plays this many times per lap */
const M=()=>{S.marks=S.marks||{};S.marks.focus=S.marks.focus||{};S.marks.known=S.marks.known||{};return S.marks;};
const mkey=it=>it.c+':'+it.e[0];
const isFocus=it=>!!M().focus[mkey(it)];
const isKnown=it=>!!M().known[mkey(it)];
function allLoopItems(){
  const src=S.settings.loopSrc,out=[];
  Object.values(COLLS).forEach(c=>{if(src==='all'||src===c.key)c.groups.forEach(g=>itemsOf(c,g).forEach(e=>out.push({c:c.key,e})));});
  return out;
}
function loopPool(){ /* items eligible for the loop, before extra copies */
  let a=allLoopItems().filter(it=>!isKnown(it));
  if(S.settings.loopFocusOnly)a=a.filter(isFocus);
  return a;
}
function loopItems(){
  const base=loopPool();
  const extra=[];
  base.forEach(it=>{if(isFocus(it))for(let k=1;k<FOCUS_COPIES;k++)extra.push(it);});
  let out=base.concat(extra);
  if(S.settings.loopShuffle){
    out=shuffled(out);
    for(let i=1;i<out.length;i++){ /* avoid the same item twice in a row */
      if(mkey(out[i])===mkey(out[i-1])){const j=(i+1<out.length)?i+1:i-2;if(j>=0&&j<out.length)[out[i],out[j]]=[out[j],out[i]];}
    }
  }
  return out;
}
function markLabelsHTML(){
  const it=LP&&LP.items[LP.i];

  return '<button class="btn mk" id="mkFocus" data-act="mkFocus" aria-pressed="'+(!!f)+'">'+(f?'★ Practicing more (tap to undo)':'★ Practice this more')+'</button>'+
    '<button class="btn mk" id="mkKnown" data-act="mkKnown">✓ I know this, skip it</button>';
}
function refreshMarkUI(){

  const it=LP&&LP.items[LP.i],e=$('#en');
  if(it&&e&&isFocus(it)&&!e.querySelector('.star'))e.insertAdjacentHTML('beforeend','<span class="star" title="Practice more">★</span>');
  if(it&&e&&!isFocus(it)){const s=e.querySelector('.star');if(s)s.remove();}
}
function loopMark(kind){
  if(!LP)return;
  const it=LP.items[LP.i];if(!it)return;
  const k=mkey(it),m=M();
  if(kind==='focus'){
    if(m.focus[k]){ /* undo: drop the extra copies still ahead in this lap */
      delete m.focus[k];
      for(let j=LP.items.length-1;j>LP.i;j--)if(mkey(LP.items[j])===k)LP.items.splice(j,1);
    }else{
      delete m.known[k];m.focus[k]=1;
      const ahead=LP.items.length-LP.i-1;
      for(let c2=1;c2<FOCUS_COPIES;c2++){const pos=LP.i+1+Math.floor(Math.random()*(ahead+1));LP.items.splice(pos,0,it);}
    }
    save();refreshMarkUI();
  }else{
    delete m.focus[k];m.known[k]=1;
    for(let j=LP.items.length-1;j>=0;j--){ /* remove every other copy; current one is passed over */
      if(j!==LP.i&&mkey(LP.items[j])===k){LP.items.splice(j,1);if(j<LP.i)LP.i--;}
    }
    save();loopJump(1);
  }
}

async function loopItem(it){
  const c=COLLS[it.c],nf=c.forms.length,P=(S.settings.loopPause+(c.loopExtra||0))*1000,teach=S.settings.loopStyle==='teach';
  const ok=()=>LP&&!LP.abort&&!LP.jump;
  const wait=async ms=>{let t=0;while(ok()&&t<ms){await new Promise(r=>setTimeout(r,100));if(!(LP&&LP.paused))t+=100;}};
  const gate=async()=>{while(ok()&&LP.paused)await new Promise(r=>setTimeout(r,150));return !!ok();};
  const st=Array(nf).fill('hidden');
  $('#hudL').textContent=c.label+' · lap '+LP.lap;$('#hudR').textContent='Item '+(LP.i+1)+' of '+LP.items.length;
  setBar(LP.i/LP.items.length);
  loopShow(it,st,'Listen','hear');
  await wait(150);if(!await gate())return;
  await say(speakable(enOf(c,it.e)),'en-US');
  for(let i=0;i<nf&&ok();i++){
    if(!teach){st[i]='ask';loopShow(it,st,nf>1?'Say the '+c.forms[i].label:'Say it in Swedish','say');await wait(P);if(!await gate())return;}
    st[i]='act';loopShow(it,st,'Listen','hear');

    if(teach){loopShow(it,st,'Say it aloud','say');await wait(P);}else await wait(500);
    st[i]='shown';

}
async function loopRun(){
  while(LP&&!LP.abort){

    const n=LP.items.length;

    if(st.opt)act+=' <button class="btn small" data-act="skip" data-c="'+c.key+'" data-g="'+gid+'" data-s="'+st.id+'">Skip</button>';
  }else if(x.blocked){
    stat='Planned for '+nice(x.due);
    act='<button class="btn small" data-act="step" data-c="'+c.key+'" data-g="'+gid+'" data-s="'+st.id+'" title="Doing this early shortens the gap">Do it now anyway</button>';
  }else{
    /* Previous step isn't marked done — still always give a manual way in,
       so a wiped or out-of-order schedule never leaves you stuck. */
    stat='Normally after the step above is done.';
    act='<button class="btn small" data-act="step" data-c="'+c.key+'" data-g="'+gid+'" data-s="'+st.id+'" title="Starts this step even though the one before it is not marked done">Start anyway</button>';
  }

function howHTML(c){
  const tl=Math.round(TRIAL_LEN(c)*10)/10;
  return '<details style="margin:14px 0 0"><summary>About, and what I changed from the paper</summary><div class="paras" style="margin-top:8px">'+
  '<p>The schedule and trial timing follow Karatas, Özemir, Lovelett, Demir, Erkol, Veríssimo, Erçetin and Ullman (2021), <i>Language Teaching Research</i> 29(1), 112-149. Turkish university students learned 64 English words over 17 days. An “optimized” group replaced re-studying with retrieval practice (say the word, then get feedback) and spread it out with growing gaps. A “typical” group studied on the first and last days. With the same number of word presentations, the optimized group’s accuracy went from about 58% to about 74% on both post-tests. The typical group’s went from about 58% to about 65%.</p>'+
  '<p><b>Schedule.</b> Day 1: pre-test, one teaching block, one retrieval block. Then a retrieval block after gaps of 2, 6 and 8 days (Days 3, 9 and 17), a post-test one day later (Day 18) and another 10 days after that (Day 28). The dates on this page count the gaps from the day you actually finished the previous step, so a late start does not break the spacing.</p>'+
  '<p><b>Trial timing.</b> In the paper a trial lasted 4.5 s: a fixation cross for 1 s, the first-language word from 0.5 s, the translation with audio at 1.0 s for 1.5 s, then a 2 s window to repeat it. Retrieval trials swap the order: a 2 s window to say the word first, then the word and audio as feedback for 1.5 s. Tests lasted 5 s: the word shown and played at 0.5 s and two answer options from 1.0 s.</p>'+
  '<p><b>My adaptations.</b></p><ul>'+
  (c.forms.length>1?'<li>Each trial here is one '+c.labelSing+' with four forms. Every form gets the paper’s single-word timing (1.5 s to hear it, 2 s to say it), so a trial is '+tl+' s instead of 4.5 s.</li>':(c.key==='sent'?'<li>The paper used single words. Sentences take longer to read, hear and say, so each trial gives '+TT(c).present+' s to hear and read the sentence and '+TT(c).respond+' s to say it aloud, '+tl+' s in all. In tests the sentence is played at once and the two answer options appear after '+TT(c).testOptAt+' s, with '+TT(c).testTrial+' s per item. These timings are my choice. Nothing in the paper tells us how long sentence trials should be, and the paper did not test sentences at all.</li>':'<li>Each trial here is one word with a single Swedish form, so it follows the paper’s single-word timing directly: 1.5 s to hear it, 2 s to say it, for a '+tl+' s trial (versus the paper’s 4.5 s, which also included the extra time to first show the first-language cue).</li>'))+
  '<li>English is the prompt language and Swedish the target, so the instructions are in English, as they were in the learners’ first language in the paper.</li>'+
  '<li>The paper does not say exactly where the prompt sits in a retrieval trial. I placed it right after the fixation cross, which is my reading of “reversed order”.</li>'+
  '<li>Audio comes from a Swedish voice on your device, not a recorded native speaker. Quality varies by device.</li>'+
  '<li>The test is a two-choice recognition test like the paper’s, with a Swedish '+(c.forms.length>1?'form':(c.key==='sent'?'sentence':'word'))+' on screen and two English options. '+(c.forms.length>1?'Half the wrong options are a different '+c.labelSing+' in the same form, and half are the same '+c.labelSing+' in a different form, so you need both the meaning and the form.':'Wrong options are a different '+(c.key==='sent'?'sentence':'word')+' from the same group.')+'</li>'+
  '<li>Nothing checks what you say aloud. The paper’s trials did not depend on that either, but saying it aloud is the point.</li>'+
  '<li>The 90% threshold for “Mastered” is mine. The paper does not define mastery. “Training complete” means the teaching block and all four retrieval blocks are done.</li></ul>'+
  '<p><b>Caution.</b> The study analysed 36 learners, and the words were single nouns and verbs. In exploratory analyses the benefit was clearest for high-frequency words, and low-frequency verbs benefited least, though that pattern was only marginally significant. The '+c.itemsLabel+' here are mixed difficulty, and I have not tested this tool against that pattern.</p>'+
  (c.key==='verb'?'<p><b>Verb colours.</b> The frame round the forms shows the conjugation group: '+Object.keys(CG).map(n=>'<span class="cgdot" style="background:'+CG[n].c+'"></span> '+CG[n].name).join('; ')+'. Group 4 also holds irregular verbs such as <i>vara</i>, <i>göra</i> and <i>kunna</i>.</p>':'')+
  (c.key==='noun'?'<p><b>Noun colours.</b> The frame round the forms shows the declension pattern: '+Object.keys(CGN).map(n=>'<span class="cgdot" style="background:var(--cg'+n+')"></span> '+CGN[n].name).join('; ')+'. The article (en or ett) is part of the singular form, so you learn the gender with the word.</p><p><b>Noun accuracy.</b> The noun forms were written without a dictionary to check them. Please check anything that looks off against Svenska Akademiens ordlista (svenskaakademien.se) or Svensk ordbok, and tell me what to correct.</p>':'')+
  (c.key==='sent'?'<p><b>Sentences.</b> Each group covers one job in conversation: agreeing and disagreeing, reacting, saying you did not understand, greetings, farewells and thanks, idioms and fixed expressions, fillers and opinions, and phone and appointment talk. The entries are short, common phrases. The idioms are ones I judged to be in everyday use, chosen from my own sense of the language and not from a frequency list, and a few are colloquial (<i>Det kvittar</i>, <i>Det är kört</i>, <i>Det är bara att köra</i>). An idiom is shown with its closest English meaning only, with no example sentence. They were written without a dictionary or a phrase book to check them, so please tell me about anything that sounds unnatural. Many have other good translations, and some English glosses are the closest match rather than a literal one. In the test, sentences with a very similar meaning are never offered against each other.</p>':'')+
  (c.key==='pv'?'<p><b>Particle verbs.</b> A particle verb is a verb plus a small word (<i>ta med</i>, <i>komma på</i>) whose meaning is often not the sum of its parts. The particle is stressed when you say it. Each entry gives the most common meaning only, and many have others. Check them against Svenska Akademiens ordlista (svenskaakademien.se) and tell me what to correct.</p>':'')+
  (c.key==='adj'?'<p><b>Adjective colours.</b> The frame round the forms shows the pattern: '+Object.keys(CGA).map(n=>'<span class="cgdot" style="background:var(--cg'+n+')"></span> '+CGA[n].name).join('; ')+'. The plural form is also the definite form (<i>den stora bilen</i>, <i>de stora bilarna</i>). The ett-form is used with ett-words (<i>ett stort hus</i>).</p><p><b>Adjective accuracy.</b> The adjective forms were written without a dictionary to check them. Please check anything that looks off against Svenska Akademiens ordlista (svenskaakademien.se) and tell me what to correct. Where two forms are spelled the same (for example <i>bra, bra, bra</i>), the test never asks you to tell them apart. For a few adjectives (for example <i>giltig</i>, <i>unik</i>, <i>begränsad</i>) the comparative is rare or sounds odd, and I gave it with <i>mer</i>.</p>':'')+
  '<p><b>Sources and notes.</b> Schedule and trial timing adapted from Karatas, N. B., Ozemir, O., Lovelett, J. T., Demir, B., Erkol, K., Verissimo, J., Ercetin, G., &amp; Ullman, M. T. (2021). Improving second language vocabulary learning and retention by leveraging memory enhancement techniques: A multidomain pedagogical approach. <i>Language Teaching Research</i>, 29(1), 112-149. The groups marked “from the test word lists”, and the Vocabulary tab, come from your Nationellt prov sfi kurs C (2009 and 2010) reading and listening texts, favouring words a test-taker might not already know. Words that appeared in the texts in another form (for example <i>fritidsintressen</i>, <i>öppettider</i>, <i>grönsaker</i>, <i>otroligt</i>, <i>unikt</i>) are taught here through their base noun or adjective. Swedish forms and audio were prepared separately and are not checked against a dictionary. Emoji are loose memory aids, not definitions. Progress syncs to your account when this page is opened as a published link, with a local-browser fallback and a manual backup code as insurance.</p>'+
  '</div></details>';
}

    ['You will see an English '+noun+'. For each of its four Swedish forms you will be asked to say it aloud, and you get '+q.respond+' seconds for that.','Then you will see and hear the correct form.','Try to answer before the correct form appears, even if you are not sure. Retrieving the word yourself is what this block is for. Each '+noun+' takes '+TRIAL_LEN(c)+' seconds.']:

function studyTrial(c,v){
  const T=TT(c),nf=c.forms.length,st=Array(nf).fill('hidden'),ev=[];
  const draw=()=>setCenter(formRowsHTML(c,v,st));
  ev.push({t:0,fn:()=>{setEn('');setCenter(fixHTML);setPrompt('');$('#notes').textContent='';}});
  ev.push({t:T.l1At,fn:()=>{setEn(enOf(c,v),emojiOf(c,v));speakEn(enOf(c,v));}});
  c.forms.forEach((f,i)=>{
    const b=T.fix+i*(T.present+T.respond);
    ev.push({t:b,fn:()=>{for(let k=0;k<nf;k++)if(st[k]==='act'||st[k]==='ask')st[k]='shown';st[i]='act';draw();setPrompt('Listen','hear');speak(v[i]);
      if(i===0){const n=notesFor(c,v);$('#notes').innerHTML=n.map(esc).join('<br>');}}});
    ev.push({t:b+T.present,fn:()=>{setPrompt('Say it aloud in Swedish','say');}});
  });
  return {dur:TRIAL_LEN(c),events:ev};
}
function retrievalTrial(c,v){
  const T=TT(c),nf=c.forms.length,st=Array(nf).fill('hidden'),ev=[];
  const draw=()=>setCenter(formRowsHTML(c,v,st));
  ev.push({t:0,fn:()=>{setEn('');setCenter(fixHTML);setPrompt('');$('#notes').textContent='';}});
  ev.push({t:T.l1At,fn:()=>{setEn(enOf(c,v),emojiOf(c,v));speakEn(enOf(c,v));}});
  c.forms.forEach((f,i)=>{
    const b=T.fix+i*(T.present+T.respond);
    const askTxt=f.label?'Say the '+f.label+' in Swedish':'Say it in Swedish';
    ev.push({t:b,fn:()=>{for(let k=0;k<nf;k++)if(st[k]==='act')st[k]='shown';st[i]='ask';draw();setPrompt(askTxt,'say');}});
    ev.push({t:b+T.respond,fn:()=>{st[i]='act';draw();setPrompt('Listen','hear');speak(v[i]);
      if(i===0){const n=notesFor(c,v);$('#notes').innerHTML=n.map(esc).join('<br>');}}});
  });
  return {dur:TRIAL_LEN(c),events:ev};
}
function testTrial(item){
  const c=COLLS[run.coll],T=TT(c),gid=run.gid,v=itemsOf(c,gById(c,gid))[item.item],word=v[item.form];
  const corr=optLabel(c,gid,{item:item.item,form:item.form}),foil=optLabel(c,gid,item.foil);
  const L=item.leftCorrect?corr:foil,R=item.leftCorrect?foil:corr;
  const rec={item:item.item,form:item.form,resp:null,correct:false};
  run.results.push(rec);
  const trial={dur:T.testTrial,events:[],onAnswer:null,rec};
  const tagHTML=t=>t?'<small>('+t+')</small>':'';
  const opts=(sel)=>'<div class="opts2"><button class="opt2'+(sel==='L'?' sel':'')+'" data-side="L">'+esc(L.en)+tagHTML(L.tag)+'<small>←</small></button><button class="opt2'+(sel==='R'?' sel':'')+'" data-side="R">'+esc(R.en)+tagHTML(R.tag)+'<small>→</small></button></div>';
  let optionsOn=false;
  trial.events.push({t:0,fn:()=>{setEn('');setCenter(fixHTML);setPrompt('');$('#notes').textContent='';}});
  trial.events.push({t:0.5,fn:()=>{setCenter('<div class="big">'+esc(word)+'</div>');setPrompt('Choose the matching meaning','hear');speak(word);}});
  trial.events.push({t:T.testOptAt,fn:()=>{optionsOn=true;setCenter('<div class="big" style="margin-bottom:14px">'+esc(word)+'</div>'+opts(null));}});
  trial.answer=side=>{
    if(!optionsOn||rec.resp)return;
    rec.resp=side;rec.correct=(side==='L')===item.leftCorrect;
    setCenter('<div class="big" style="margin-bottom:14px">'+esc(word)+'</div>'+opts(side));
    if(S.settings.fast)ctl.skip=true;
  };
  return trial;
}

/* ---------- engine ---------- */
function playTrial(trial){
  return new Promise(resolve=>{
    let el=0,last=performance.now(),i=0;
    run.trial=trial;
    const iv=setInterval(()=>{
      if(ctl.abort){clearInterval(iv);resolve('abort');return;}
      const now=performance.now(),dt=(now-last)/1000*SPEED;last=now;
      if(!ctl.paused)el+=dt;
      while(i<trial.events.length&&trial.events[i].t<=el){trial.events[i].fn();i++;}
      setBar(el/trial.dur);
      if(el>=trial.dur||ctl.skip){ctl.skip=false;clearInterval(iv);resolve('done');return;}
    },1000/30/SPEED);
  });
}
function countdown(){
  return new Promise(resolve=>{
    let n=3;
    const show=()=>{setCenter('<div class="cd">'+n+'</div>');};
    setEn('');setPrompt('Get ready');show();
    const iv=setInterval(()=>{
      if(ctl.abort){clearInterval(iv);resolve('abort');return;}
      if(ctl.paused)return;
      n--;if(n<=0){clearInterval(iv);resolve('done');}else show();
    },1000/SPEED);
  });
}
async function startRun(){
  unlockAudio();
  requestWake();
  view={name:'run'};
  app().innerHTML=stageHTML();
  ctl={paused:false,abort:false,skip:false};
  run.idx=0;run.results=[];
  const c=COLLS[run.coll];
  $('#hudL').textContent=c.label+' — Group '+run.gid;
  if((await countdown())==='abort')return;
  for(let i=0;i<run.trials.length;i++){
    run.idx=i;
    $('#hudR').textContent='Item '+(i+1)+' of '+run.trials.length;
    const item=run.trials[i];
    let trial;
    if(run.kind==='study')trial=studyTrial(c,itemsOf(c,gById(c,run.gid))[item]);
    else if(run.kind==='retrieval')trial=retrievalTrial(c,itemsOf(c,gById(c,run.gid))[item]);
    else trial=testTrial(item);
    const r=await playTrial(trial);
    if(r==='abort'||ctl.abort)return;
  }
  try{speechSynthesis.cancel();}catch(e){}
  finishRun();
}
function stopRun(){ctl.abort=true;releaseWake();stopLoop();try{speechSynthesis.cancel();}catch(e){}}

/* ---------- start / finish ---------- */
function makeRun(collKey,gid,kind,stepId,extra){
  const c=COLLS[collKey],n=itemsOf(c,gById(c,gid)).length;
  let trials;
  if(kind==='test')trials=shuffled(testItems(c,gid));
  else trials=shuffled(Array.from({length:n},(_,i)=>i));
  run={coll:collKey,gid,kind,stepId,extra,trials,results:[]};
}
function finishRun(){
  releaseWake();
  const c=COLLS[run.coll],gid=run.gid,g=gById(c,gid);
  const nextStepHTML=()=>{
    const av=availability(c,gid),nx=av.find(x=>!x.done);
    if(!nx)return '<p>All steps in this group are done.</p>';
    if(nx.ready)return '<p>Next: <b>'+nx.st.label+'</b> is ready now.</p>';
    return '<p>Next: <b>'+nx.st.label+'</b>, planned for <b>'+nice(nx.due)+'</b>.</p>';
  };
  let body='';
  if(run.kind==='test'){
    const total=run.results.length,correct=run.results.filter(r=>r.correct).length,pct=correct/total;
    const missed=run.results.filter(r=>!r.correct).map(r=>({item:r.item,form:r.form}));
    if(run.stepId&&!run.extra){gstate(c,gid).steps[run.stepId]={date:today(),correct,total,pct,missed};save();}
    const msg=pct>=MASTER?'Excellent':(pct>=0.7?'Good':'Keep going');
    body='<div class="pen"><b>'+correct+'/'+total+'</b><svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C 25 1, 60 9, 98 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><em>'+msg+'</em></div>'+
      '<p>'+Math.round(pct*100)+'% correct.'+(run.extra?' This was extra practice, so it is not saved to the schedule.':'')+'</p>';
    if(run.stepId==='t2'&&!run.extra)body+='<p>'+(pct>=MASTER?'That is at or above your 90% mastery threshold, so <b>Group '+gid+' is now marked as mastered</b>.':'That is below the 90% mastery threshold. You can start this group over, or use extra practice on the items you missed.')+'</p>';
    if(missed.length)body+='<p style="margin-bottom:0"><b>Missed</b></p><ul class="miss">'+missed.map(m=>{const v=itemsOf(c,g)[m.item];const tag=c.forms[m.form].label;return '<li><span class="sv">'+esc(v[m.form])+'</span>'+(tag?' ('+tag+')':'')+': '+esc(enOf(c,v))+'</li>';}).join('')+'</ul>';
    else body+='<p>You got every item right.</p>';
  }else{
    if(run.stepId&&!run.extra){gstate(c,gid).steps[run.stepId]={date:today()};save();}
    body='<p>'+(run.kind==='study'?'Teaching':'Retrieval')+' block finished: '+run.trials.length+' '+c.itemsLabel+'.'+(run.extra?' This was extra practice, so it is not saved to the schedule.':'')+'</p>';
  }
  let btns='';
  if(!run.extra&&run.stepId==='study')btns+='<button class="btn primary" data-act="step" data-c="'+c.key+'" data-g="'+gid+'" data-s="r1">Continue to the retrieval block</button> ';
  btns+='<button class="btn'+(btns?'':' primary')+'" data-act="home" data-c="'+c.key+'">Back to groups</button>';
  view={name:'result'};
  app().innerHTML='<div class="panel res"><h2>'+c.label+' — Group '+gid+' finished</h2><div class="in">'+body+(run.extra?'':nextStepHTML())+'<p>'+btns+'</p></div></div>';
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const side=e.target.closest('[data-side]');
  if(side&&run&&run.trial&&run.trial.answer){run.trial.answer(side.dataset.side);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,ck=b.dataset.c,gid=+b.dataset.g;
  if(act==='menu'){stopLoop();renderMenu();}
  else if(act==='coll'){stopLoop();renderHome(ck);}
  else if(act==='loopTab'){renderLoop();}
  else if(act==='loopStart'){loopStart();}
  else if(act==='loopStop'){renderLoop();}
  else if(act==='loopPrev'){loopJump(-1);}
  else if(act==='loopNext'){loopJump(1);}
  else if(act==='mkFocus'){loopMark('focus');}
  else if(act==='mkKnown'){loopMark('known');}
  else if(act==='unmark'){delete M()[b.dataset.kind][b.dataset.k];save();renderLoop(null,true);}
  else if(act==='clearMarks'){
    if(b.dataset.armed){M()[b.dataset.kind]={};save();renderLoop(null,true);}
    else{b.dataset.armed='1';const old=b.textContent;b.textContent='Tap again to clear all';setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=old;}},4000);}
  }
  else if(act==='loopPause'&&LP){LP.paused=!LP.paused;b.textContent=LP.paused?'Resume':'Pause';}
  else if(act==='step'){
    const st=STEPS.find(s=>s.id===b.dataset.s);
    makeRun(ck,gid,st.kind,st.id,false);renderInstr();window.scrollTo(0,0);
  }else if(act==='skip'){
    gstate(COLLS[ck],gid).steps[b.dataset.s]={date:today(),skipped:true};save();renderHome(ck);
  }else if(act==='extra'){
    makeRun(ck,gid,b.dataset.k,null,true);renderInstr();window.scrollTo(0,0);
  }else if(act==='begin'){startRun();}
  else if(act==='home'){stopRun();renderHome(ck||view.coll);}
  else if(act==='pause'){ctl.paused=!ctl.paused;b.textContent=ctl.paused?'Resume':'Pause';if(ctl.paused){try{speechSynthesis.cancel();}catch(e){}}}
  else if(act==='quit'){
    if(b.dataset.armed){stopRun();renderHome(run?run.coll:view.coll);}
    else{b.dataset.armed='1';b.textContent='Confirm quit (progress not saved)';ctl.paused=true;$('#pauseB').textContent='Resume';}
  }
  else if(act==='reset'){
    if(b.dataset.armed){delete S[ck].groups[gid];save();renderHome(ck);}
    else{b.dataset.armed='1';b.textContent='Click again to erase this group’s progress';}
  }
});
document.addEventListener('keydown',e=>{
  if(view.name!=='run')return;
  if(e.key===' '&&!e.target.closest('button')){e.preventDefault();$('#pauseB').click();}
  else if(e.key==='Escape'){$('#quitB').click();}
  else if(run&&run.trial&&run.trial.answer){
    if(e.key==='ArrowLeft'||e.key==='1'){e.preventDefault();run.trial.answer('L');}
    else if(e.key==='ArrowRight'||e.key==='2'){e.preventDefault();run.trial.answer('R');}
  }
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(view.name==='run'||view.name==='loop')&&S.settings.wake)requestWake();});
document.addEventListener('change',e=>{
  if(e.target.id==='audioOn'){S.settings.audio=e.target.checked;save();loadVoices();}
  else if(e.target.id==='voice'){S.settings.voice=e.target.value;save();}
  else if(e.target.id==='rate'){S.settings.rate=parseFloat(e.target.value)||1;save();}
  else if(e.target.id==='fastNext'){S.settings.fast=e.target.checked;save();}
  else if(e.target.id==='enAudio'){S.settings.enAudio=e.target.checked;save();}
  else if(e.target.id==='wakeOn'){S.settings.wake=e.target.checked;save();if(!e.target.checked)releaseWake();}
  else if(e.target.id==='loopSrc'){S.settings.loopSrc=e.target.value;save();}
  else if(e.target.id==='loopStyle'){S.settings.loopStyle=e.target.value;save();}
  else if(e.target.id==='loopPause'){S.settings.loopPause=parseFloat(e.target.value)||2;save();}
  else if(e.target.id==='loopShuffle'){S.settings.loopShuffle=e.target.checked;save();}
  else if(e.target.id==='loopFocusOnly'){S.settings.loopFocusOnly=e.target.checked;save();}
});
document.addEventListener('click',e=>{
  if(e.target.id==='voiceTest'){unlockAudio();speak('arbetar');}
  else if(e.target.id==='codeCopy'){
    const code=backupCode(),msg=$('#codeMsg');
    const done=()=>{if(msg){msg.textContent='Copied.';setTimeout(()=>{if(msg.textContent==='Copied.')msg.textContent='';},3000);}};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(done).catch(()=>{$('#codeIn').value=code;if(msg)msg.textContent='Could not use the clipboard — code is in the box below, copy it manually.';});
    else{$('#codeIn').value=code;if(msg)msg.textContent='Code is in the box below — copy it manually.';}
  }else if(e.target.id==='codeRestore'){
    const v=$('#codeIn').value,msg=$('#codeMsg');
    if(!v.trim()){if(msg)msg.textContent='Paste a code first.';return;}
    if(restoreFromCode(v)){if(msg)msg.textContent='Restored.';setTimeout(()=>renderHome(view.coll),900);}
    else if(msg)msg.textContent='That code did not look right.';
  }
});

renderMenu();
initCloud();
window.__debug={get run(){return run;},get view(){return view;},get S(){return S;}};

</script>
