button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--line,var(--ink));outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 64px}
.hint{font-size:.9rem;color:var(--soft)}
.warnText{color:var(--again)}
.sp{margin-left:auto}
.sv{font-family:var(--font-read)}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 0;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.crumb{font-weight:600;font-size:1.02rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 20px;min-height:44px;font-weight:600;font-size:.97rem;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 85%,var(--paper))}
.btn.line{background:var(--line);border-color:var(--line);color:var(--on-line)}
.btn.ghost{border-color:var(--rule)}
.btn.small{min-height:36px;padding:5px 14px;font-size:.88rem;font-weight:500}
.btn.danger{border-color:var(--again);color:var(--again)}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.9rem}
.linkbtn:hover{color:var(--ink)}

/* menu */
.hero{padding:18px 0 22px}
.hero h1{margin:0;font:500 clamp(2.5rem,10vw,4rem)/1 var(--font-read);letter-spacing:-.025em}
.lede{margin:10px 0 0;color:var(--soft);font-size:1.05rem}
.h2s{margin:30px 0 10px;font-size:.95rem;font-weight:600;color:var(--soft)}
.board{background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.board>.empty{margin:0;padding:18px 20px;color:var(--soft)}
.dep{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 18px}
.dep+.dep{border-top:1px solid var(--rule-2)}
.dep .t b{display:block;font-weight:600}
.dep .t>span{display:block;color:var(--soft);font-size:.9rem}
.dep .late{color:var(--again);font-weight:500}
.bdg{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 9px;border-radius:10px;background:var(--line);color:var(--on-line);font-weight:700;font-size:.95rem;line-height:1}
.bdg.big{min-width:48px;height:48px;border-radius:14px;font-size:1.1rem}
.rows{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:12px 16px 12px 12px;cursor:pointer;transition:border-color .15s,transform .05s}
.rowbtn:hover{border-color:var(--line)}
.rowbtn:active{transform:translateY(1px)}
.rowbtn .t b{display:block;font-size:1.12rem;font-weight:600}
.rowbtn .t>span{display:block;color:var(--soft);font-size:.88rem;line-height:1.3}
.rowbtn .prog{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:.82rem;color:var(--soft)}
.mini{display:block;width:74px;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.mini i{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--line);border-radius:3px}
.chev{color:var(--soft);font-size:1.4rem;line-height:1}
.pip{display:inline-block;min-width:1.5em;padding:0 .45em;border-radius:99px;background:var(--hue-deck);color:var(--on-line);font-size:.78rem;font-weight:700;text-align:center;margin-left:6px;vertical-align:.1em}

/* collection screen */
.sech{padding:6px 0 12px}
.sech h1{margin:0;font:500 clamp(2.2rem,8vw,3.2rem)/1.05 var(--font-read);letter-spacing:-.02em;color:var(--line)}
.sech p{margin:6px 0 0;color:var(--soft)}
.mode{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--rule-2);margin:0 0 16px}
.mode button{border:0;background:none;padding:7px 18px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--soft);cursor:pointer;min-height:36px}
.mode button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.route{list-style:none;margin:22px 0 0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:19px;top:22px;bottom:30px;width:4px;border-radius:2px;background:color-mix(in srgb,var(--line) 30%,var(--rule))}
.stop{position:relative;padding:0 0 16px 60px}
.mark{position:absolute;left:0;top:6px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;background:conic-gradient(var(--line) calc(var(--p,0)*1%),var(--rule) 0)}
.mark::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.mark span{position:relative}
.stop.trained .mark{background:var(--line)}
.stop.trained .mark::before{background:var(--bg);inset:6px}
.stop.mastered .mark{background:var(--line);color:var(--on-line)}
.stop.mastered .mark::before{display:none}
.stopcard{background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.stopcard .gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding:14px 18px 6px}
.stopcard h3{margin:0;font-size:1.2rem;font-weight:600}
.stopcard .count{color:var(--soft);font-size:.88rem}
.badge{margin-left:auto;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--line) 14%,var(--paper));color:var(--line)}
.seg{display:flex;gap:4px;padding:6px 18px 4px}
.seg i{flex:1;height:5px;border-radius:3px;background:var(--rule)}
.seg i.d{background:var(--line)}
.seg i.c{background:color-mix(in srgb,var(--line) 40%,var(--rule));outline:1.5px solid var(--line);outline-offset:-1.5px}
.steps{list-style:none;margin:0;padding:4px 18px}
.steps li{display:grid;grid-template-columns:4rem 1fr auto;gap:2px 12px;align-items:center;padding:10px 0}
.steps li+li{border-top:1px solid var(--rule-2)}
.steps .day{font-weight:600;color:var(--soft);font-size:.9rem}
.steps .nm b{font-weight:600}
.steps .st{font-size:.9rem;color:var(--soft)}
.steps li.done .st{color:var(--good)}
.steps li.ready .st{color:var(--line);font-weight:600}
.steps li.done .day::after{content:" ✓";color:var(--good)}
.scores{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0;padding:2px 18px 12px;font-size:.9rem;color:var(--soft)}
.scores b{color:var(--ink);font-weight:600}
.more{border-top:1px solid var(--rule-2)}
.more>summary{list-style:none;cursor:pointer;padding:12px 18px;font-size:.92rem;font-weight:500;color:var(--soft);display:flex;justify-content:space-between;align-items:center}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:"+";font-size:1.2rem}
.more[open]>summary::after{content:"–"}
.more .in{padding:0 18px 16px}
.more h4{margin:14px 0 4px;font-size:.92rem;font-weight:600}
.more .steps{padding:0}
.pr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.verbtable{width:100%;border-collapse:collapse;font-size:.95rem}
.verbtable th,.verbtable td{border-bottom:1px solid var(--rule-2);padding:6px 8px 6px 0;text-align:left}
.verbtable thead th{color:var(--soft);font-weight:500;font-size:.85rem}
.verbtable td.sv{font-size:1.05rem}
.cgdot{display:inline-block;width:.75em;height:.75em;border-radius:50%;vertical-align:-.04em}
.about{margin:26px 0 0;font-size:.95rem}
.about>summary{cursor:pointer;color:var(--soft);font-weight:500}
.paras p{margin:0 0 .7em}
.paras ul{margin:.2em 0 .7em;padding-left:1.2em}

/* generic panels, banners, settings */
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:16px;margin:0 0 18px;overflow:hidden}
.panel>h2{margin:0;padding:16px 18px 6px;font-size:1.25rem;font-weight:600}
.panel .in{padding:8px 20px 20px}
.banner{border-left:4px solid var(--line);background:color-mix(in srgb,var(--line) 9%,var(--paper));padding:10px 14px;border-radius:8px;font-size:.95rem;margin:0 0 14px}
.banner.warn{border-left-color:var(--again);background:color-mix(in srgb,var(--again) 9%,var(--paper))}
.sec{background:var(--paper);border:1px solid var(--rule);border-radius:16px;margin:0 0 16px;overflow:hidden}
.sec>h2{margin:0;padding:14px 18px 6px;font-size:1.1rem;font-weight:600}
.sec>p{margin:0;padding:0 18px 12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;border-top:1px solid var(--rule-2);cursor:pointer}
.setrow>span{flex:1}
.setrow small{display:block;color:var(--soft);font-size:.85rem;line-height:1.35;margin-top:2px}
.setrow select{background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:7px 10px;min-height:38px;max-width:55%}
.setrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink);flex:none}
.sync{margin:0 0 14px}
textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--paper-2)}
.bk{padding:12px 18px 16px;border-top:1px solid var(--rule-2)}
.bk p{margin:0 0 10px}
.tog{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--paper-2)}
.settings{display:grid;gap:10px;font-size:.95rem}
.settings label{display:flex;align-items:center;gap:12px}
.settings label select{margin-left:auto;flex:0 1 62%;min-width:0}
.settings select{background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;min-height:38px}
.settings input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}

/* session stage */
.stage{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule);border-radius:20px;min-height:min(82vh,640px);margin:12px 0;overflow:hidden}
.tbar{order:-1;height:6px;background:var(--rule-2)}
.tbar i{display:block;height:100%;width:0;background:var(--line);transition:width .1s linear}
.hud{display:flex;align-items:center;gap:8px 12px;padding:12px 16px;font-size:.92rem;color:var(--soft)}
.hud #hudL{font-weight:600;color:var(--line)}
.hud .sp{margin-left:auto}
.sbody{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 14px 10px;text-align:center}
.en{min-height:2.7em;font:600 clamp(1.5rem,5.2vw,2.2rem)/1.2 var(--font-ui);letter-spacing:-.01em}
.en small{display:block;margin-bottom:4px;font-size:.8rem;font-weight:500;color:var(--soft);letter-spacing:0}
.en .star{color:var(--hue-deck);margin-left:.3em}
.emo{font-size:1.2em;margin-right:.25em}
.center{width:100%;max-width:540px;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.fix{font-size:4.5rem;line-height:1;color:var(--rule);font-weight:300}
.frow{display:grid;grid-template-columns:6.8rem 1fr;align-items:baseline;gap:12px;padding:10px 16px;border:1.5px solid transparent;border-radius:14px;text-align:left}
.frow .lb{color:var(--soft);font-size:.85rem}
.frow .w{font:500 clamp(1.8rem,6.4vw,2.6rem)/1.15 var(--font-read);min-height:1.2em;overflow-wrap:anywhere}
.frow.hidden .w{background:linear-gradient(var(--rule),var(--rule)) 0 85%/100% 2px no-repeat}
.frow.act{border-color:var(--line);background:color-mix(in srgb,var(--line) 9%,var(--paper))}
.frow.ask{border:1.5px dashed var(--again);background:color-mix(in srgb,var(--again) 7%,var(--paper))}
.frow.ask .w{background:linear-gradient(var(--again),var(--again)) 0 85%/100% 2px no-repeat}
.fgrp{display:flex;flex-direction:column;gap:6px;width:100%;padding:8px;border:2px solid var(--cg);border-left-width:8px;border-radius:16px;background:color-mix(in srgb,var(--cg) 6%,var(--paper))}
.fgrp .frow.act{border-color:var(--cg);background:color-mix(in srgb,var(--cg) 14%,var(--paper))}
.gtag{font-size:.78rem;font-weight:600;color:var(--cg);text-align:left;padding:0 8px}
.notes{max-width:520px;min-height:1.4em;font-size:.88rem;color:var(--soft)}
.prompt{min-height:2.2em;font-size:1.1rem;font-weight:600}
.prompt.say{color:var(--again)}
.prompt.hear{color:var(--line)}
.big{font:500 clamp(2.4rem,9vw,3.6rem)/1.1 var(--font-read)}
.cd{font:300 6rem/1 var(--font-read);color:var(--soft)}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px;min-height:6.5rem}
.opt2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 10px;border:1.5px solid var(--rule);border-radius:16px;background:var(--paper);cursor:pointer;font-size:1.1rem;font-weight:500}
.opt2 small{color:var(--soft);font-size:.85rem}
.opt2:hover{background:var(--paper-2)}
.opt2.sel{border-color:var(--line);background:color-mix(in srgb,var(--line) 11%,var(--paper))}

/* rating bar */
.ratebar{display:none;padding:12px 14px 16px;border-top:1px solid var(--rule);background:var(--paper-2)}
.ratebar.on{display:block}
.ratebar p{margin:0 0 10px;text-align:center;color:var(--soft);font-size:.92rem}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto}
.rate{--c:var(--good);display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;min-height:64px;border:1.5px solid var(--c);border-radius:14px;background:var(--paper);color:var(--c);font-weight:700;font-size:1.02rem;cursor:pointer}
.rate small{font-weight:500;font-size:.76rem;line-height:1.2;color:var(--soft);text-align:center}
.rate:hover{background:color-mix(in srgb,var(--c) 10%,var(--paper))}
.rate[data-r="1"]{--c:var(--again)}
.rate[data-r="2"]{--c:var(--hard)}
.rate[data-r="3"]{--c:var(--good)}
.rate[data-r="4"]{--c:var(--easy)}
.ratebar .foot{margin:10px 0 0;text-align:center}
.rate.sel{background:var(--c);color:var(--on-line)}
.rate.sel small{color:inherit}
.rate[disabled]{opacity:.4;cursor:default}
.ratebar .linkbtn{font-size:.88rem}
.ratemsg{min-height:1.4em}

/* loop controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.ctl .btn{flex:1 1 auto}
.ctl2{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ctl2 .btn{flex:1 1 auto}
.btn.hard{border-color:var(--hue-deck);color:var(--hue-deck)}
.btn.hard.on{background:color-mix(in srgb,var(--hue-deck) 14%,var(--paper))}
.mklist{list-style:none;margin:6px 0 0;padding:0;font-size:.95rem}
.mklist li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0}
.mklist li+li{border-top:1px solid var(--rule-2)}

/* results */
.res .pen{display:inline-block;margin:6px 0 10px;text-align:center;color:var(--line)}
.res .pen b{display:block;font:500 4.2rem/1 var(--font-read)}
.res .pen svg{display:block;width:100%;height:12px;margin-top:-2px}
.res .pen em{font-style:normal;font-size:1.4rem;font-weight:600}
.miss{list-style:none;margin:8px 0 0;padding:0;columns:2 250px;font-size:.95rem}
.miss li{padding:3px 0;break-inside:avoid}

/* hard items screen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:14px 16px}
.stat b{display:block;font:500 2.4rem/1 var(--font-read)}
.stat span{color:var(--soft);font-size:.88rem}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 18px;margin:0 0 16px;border-radius:16px;background:color-mix(in srgb,var(--hue-deck) 12%,var(--paper));border:1px solid color-mix(in srgb,var(--hue-deck) 40%,var(--rule))}
.cta p{margin:0;flex:1 1 220px}
.cta .btn.primary{background:var(--hue-deck);border-color:var(--hue-deck);color:var(--on-line)}
.dlist{list-style:none;margin:0;padding:0}
.drow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px}
.drow+.drow{border-top:1px solid var(--rule-2)}
.drow .t b{font:500 1.25rem/1.2 var(--font-read);display:block}
.drow .t>span{display:block;color:var(--soft);font-size:.86rem}
.drow .bdg{min-width:30px;height:30px;font-size:.8rem;border-radius:8px}
.drow .due{color:var(--hue-deck);font-weight:600}
.danger-zone{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.dz{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:14px 18px}
.dz+.dz{border-top:1px solid var(--rule-2)}
.dz p{margin:0;flex:1 1 220px}
.dz small{display:block;color:var(--soft)}

@media (max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 12px 56px}
  .frow{grid-template-columns:5.2rem 1fr;padding:8px 12px}
  .steps li{grid-template-columns:3.4rem 1fr}
  .steps li .act{grid-column:2}
  .rowbtn{grid-template-columns:auto 1fr auto;gap:12px}
  .rowbtn .prog{display:none}
  .stop{padding-left:54px}
  .mark{width:38px;height:38px}
  .route::before{left:17px}
  .setrow select{max-width:48%}
  .rate small{font-size:.7rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.top .btn{flex:none}
.sub2{margin:0 0 14px;color:var(--soft)}
.kbd{font-size:.8rem;color:var(--soft)}
.loopnote{margin:0 0 12px}
.cardlist{background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden;margin:0 0 18px}
.cardlist>.empty{margin:0;padding:18px 20px;color:var(--soft)}
details.skipped{margin:0 0 18px;background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
details.skipped>summary{cursor:pointer;padding:14px 18px;font-weight:600}
details.skipped .in{padding:0 18px 14px}
.stopcard .btn.primary,.res .btn.primary,.sech~.panel .btn.primary{background:var(--line);border-color:var(--line);color:var(--on-line)}

#app>div>.sech:first-child{padding-top:24px}
.stat span{display:block}

.goal{display:grid;grid-template-columns:1fr minmax(70px,34%) auto;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin:0 0 6px;cursor:pointer}
.goal:hover{border-color:var(--line)}
.goal .gt b{display:block;font-weight:600}
.goal .gt>span{display:block;color:var(--soft);font-size:.9rem;line-height:1.35}
.gbar{display:block;height:8px;border-radius:4px;background:var(--rule-2);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--line);border-radius:4px}
.gbar.wide{height:12px;border-radius:6px}
.banner.earned{border-left-color:var(--hue-reward);background:color-mix(in srgb,var(--hue-reward) 13%,var(--paper))}
.stats.four{grid-template-columns:repeat(4,1fr)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cell{display:block;aspect-ratio:1;border-radius:7px;border:2px solid var(--line);background:transparent}
.cell.s-none{border-color:var(--rule)}
.cell.s-started{background:color-mix(in srgb,var(--line) 30%,transparent)}
.cell.s-trained{background:color-mix(in srgb,var(--line) 65%,transparent)}
.cell.s-complete{background:var(--line)}
.chart{display:flex;align-items:flex-end;gap:5px;height:150px}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:.72rem;color:var(--soft)}
.chart .bar{display:block;width:100%;background:color-mix(in srgb,var(--line) 55%,var(--paper));border-radius:4px 4px 0 0}
.chart .col.now .bar{background:var(--line)}
.chart .mk{color:var(--good);font-weight:700;min-height:1em;line-height:1}
.rwlist{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:10px}
.rw{border:1px solid var(--rule);border-radius:14px;padding:12px 14px;background:var(--paper-2)}
.rw.earned{border-color:var(--hue-reward);background:color-mix(in srgb,var(--hue-reward) 11%,var(--paper))}
.rw.claimed{opacity:.8}
.rw.missed .rwbar i{background:var(--soft)}
.rwh{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.rwh b{font-size:1.05rem}
.rwbar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;margin:8px 0 0}
.rwbar i{display:block;height:100%;background:var(--hue-reward);border-radius:4px}
.rwt{margin:8px 0}
.rwa{display:flex;flex-wrap:wrap;gap:8px}
.rwform{border-top:1px solid var(--rule-2);padding-top:14px}
.rwform h3{margin:0 0 10px;font-size:1.02rem;font-weight:600}
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:.88rem;color:var(--soft);margin-bottom:4px}
.fld input,.fld select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper-2)}
.setrow input[type=date]{min-height:40px;padding:6px 10px;border:1px solid var(--rule);border-radius:10px;background:var(--paper-2);max-width:55%}
@media (max-width:560px){.stats.four{grid-template-columns:repeat(2,1fr)}.goal{grid-template-columns:1fr 70px auto}}

.btn.mk[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
[hidden]{display:none!important}

/* ================= dates ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};

/* ================= plan / progress ================= */
function plan(c,gid){
  const gs=gstate(c,gid);let prev=null;
  return STEPS.map((st,i)=>{
    const rec=gs.steps[st.id];const done=!!(rec&&rec.date);
    const due=done?rec.date:(prev?addDays(prev,st.gap):today());
    prev=due;
    return {st,rec,done,due,i};
  });
}
function availability(c,gid){
  const p=plan(c,gid),t=today();
  return p.map((x,i)=>{
    let priorDone=true;
    for(let j=0;j<i;j++){if(!p[j].done)priorDone=false;}
    x.priorDone=priorDone;
    x.ready=!x.done&&priorDone&&diff(t,x.due)>=0;
    x.blocked=!x.done&&priorDone&&diff(t,x.due)<0;   /* previous steps done, but too early */
    x.early=x.blocked;
    x.late=x.ready?Math.max(0,diff(t,x.due)):0;
    return x;
  });
}
function groupStatus(c,gid){
  const gs=gstate(c,gid),st=gs.steps;
  const trained=['study','r1','r2','r3','r4'].every(k=>st[k]&&st[k].date);
  const final=st.t2&&st.t2.date&&st.t2.pct!=null?st.t2.pct:null;
  return {trained,mastered:final!=null&&final>=MASTER,final};
}

/* ================= review deck (hard items, scheduled with FSRS) =================
   Items you flag as hard (Again or Hard in a retrieval block, or the Hard button in the loop)
   get their own FSRS card with a due date. Everything else stays on the paper's fixed schedule.
   Cards are stored in S.deck.cards, so they sync and travel with the backup code. */
const DECK_SESSION=30;      /* most cards in one review session */
let _fsrs=null,_fsrsRet=null,ITEMIDX=null;
function F(){
  const r=Number(S.settings.deckRetention)||0.9;
  if(!_fsrs||_fsrsRet!==r){_fsrs=FSRS.fsrs(FSRS.generatorParameters({request_retention:r,enable_fuzz:true,enable_short_term:false}));_fsrsRet=r;}
  return _fsrs;
}
const DK=()=>{S.deck=S.deck||{};S.deck.cards=S.deck.cards||{};S.deck.grad=S.deck.grad||{};return S.deck;};
function itemIndex(){
  if(!ITEMIDX){ITEMIDX={};Object.values(COLLS).forEach(c=>c.groups.forEach(g=>itemsOf(c,g).forEach(e=>{ITEMIDX[c.key+':'+e[0]]={c:c.key,e,gid:g.id};})));}
  return ITEMIDX;
}
const reviveCard=cd=>Object.assign({},cd,{due:new Date(cd.due),last_review:cd.last_review?new Date(cd.last_review):undefined});
const dueDay=ent=>iso(new Date(ent.card.due));
const isDue=ent=>dueDay(ent)<=today();
const gradDays=()=>{const g=Number(S.settings.deckGrad);return isNaN(g)?30:g;}; /* 0 means off */
function deckEntries(){
  const D=DK(),idx=itemIndex();
  return Object.keys(D.cards).filter(k=>idx[k]&&D.cards[k]&&D.cards[k].card).map(k=>Object.assign({k},D.cards[k],{it:idx[k]}));
}
const dueCards=()=>deckEntries().filter(isDue).sort((a,b)=>new Date(a.card.due)-new Date(b.card.due));
const masteredCards=()=>{const t=gradDays()||30;return deckEntries().filter(x=>x.card.state===2&&x.card.scheduled_days>=t);};
const deckCount=()=>deckEntries().length;
const gradCount=()=>Object.keys(DK().grad).length;
function dueLabel(ent){
  const d=diff(dueDay(ent),today());
  if(d<0)return 'Overdue by '+(-d)+(d===-1?' day':' days');
  if(d===0)return 'Due today';
  return d===1?'Due tomorrow':'Due in '+d+' days';
}
/* Apply one rating (1 Again, 2 Hard, 3 Good, 4 Easy). Again/Hard on an item that is not in the deck
   adds it. Good/Easy on an item that is not in the deck does nothing. Good/Easy on a card whose new
   interval reaches the graduation setting removes it from the deck. */
function deckRate(ck,e,rating){
  if(!window.FSRS)return {error:true};
  const D=DK(),k=ck+':'+e[0],now=new Date();
  let ent=D.cards[k],card,isNew=false;
  if(!ent){
    if(rating>=3)return {kept:false};
    isNew=true;ent={c:ck,w:e[0],card:null,hard:0,reps:0,added:today()};card=FSRS.createEmptyCard(now);
  }else card=reviveCard(ent.card);
  const res=F().next(card,now,rating);
  const days=res.card.scheduled_days;
  if(!isNew&&rating>=3&&gradDays()>0&&days>=gradDays()){
    delete D.cards[k];D.grad[k]=today();save();
    return {graduated:true,days};
  }
  ent.card=JSON.parse(JSON.stringify(res.card));
  ent.reps=(ent.reps||0)+1;if(rating<=2)ent.hard=(ent.hard||0)+1;ent.last=today();
  if(isNew)delete D.grad[k];
  D.cards[k]=ent;save();
  return {added:isNew,days,due:ent.card.due};
}
const deckSnap=k=>{const x=DK().cards[k];return x?JSON.stringify(x):null;};
function deckRestore(k,snap){const D=DK();if(snap)D.cards[k]=JSON.parse(snap);else delete D.cards[k];save();}
function deckRemove(k,graduate){const D=DK();delete D.cards[k];if(graduate)D.grad[k]=today();save();}
function rateMsg(r,rating){
  if(!r||r.error)return 'The review scheduler did not load, so nothing was saved.';
  if(r.graduated)return 'Removed from the deck. The next review would have been in '+r.days+' days.';
  if(r.kept===false)return 'Not added to the deck.';
  const d=r.days;
  if(r.added)return 'Added to the deck. First review '+(d<=1?'tomorrow':'in '+d+' days')+'.';
  return 'Next review '+(d<=1?'tomorrow':'in '+d+' days')+'.';
}

/* ================= progress tracking and weekly rewards =================
   Everything here is stored in S.track, so it lives in localStorage with the rest of your progress,
   syncs when sync is available, and travels with the backup code.
   S.track = { start:'YYYY-MM-DD', days:{ date:{sec,loopSec,started:['noun:1'],steps,deck} }, rewards:[{id,week,label,minutes,claimed}] } */
const TRK=()=>{const t=S.track=S.track||{};t.days=t.days||{};t.rewards=t.rewards||[];return t;};

const ACTIVE_SEC=300;      /* a day counts toward the streak with at least 5 minutes of practice */
const LAST_START_TAIL=27;  /* days from a group's first step to its last (Post-test 2) */
let trkPending=0;
function trkStart(){
  const t=TRK();if(t.start)return t.start;
  let m=null;
  Object.values(COLLS).forEach(c=>c.groups.forEach(g=>{const st=((S[c.key].groups||{})[g.id]||{}).steps||{};Object.values(st).forEach(r=>{if(r&&r.date&&(!m||r.date<m))m=r.date;});}));
  return m||today();
}
function trkTouch(){
  const t=TRK(),d=today();
  if(!t.start)t.start=trkStart();
  return t.days[d]=t.days[d]||{sec:0,loopSec:0,started:[],steps:0,deck:0};
}
function trackTick(dt){if(dt>0&&dt<2)trkPending+=dt;}   /* real seconds of an unpaused block */
function trackFlush(){if(trkPending<=0)return;const r=trkTouch();r.sec+=trkPending;trkPending=0;save();}
function trackLoop(L){ /* wall-clock time of one loop item, minus the time spent paused */
  if(!L||!L.t0)return;
  const now=Date.now();
  let ms=now-L.t0-(L.pausedMs||0)-((L.paused&&L.pStart)?now-L.pStart:0);
  if(ms<=0)return;
  ms=Math.min(ms,180000);
  const r=trkTouch();r.sec+=ms/1000;r.loopSec+=ms/1000;save();
}
function loopSetPaused(v){
  if(!LP||!!LP.paused===!!v)return;
  if(v)LP.pStart=Date.now();else LP.pausedMs=(LP.pausedMs||0)+(Date.now()-(LP.pStart||Date.now()));
  LP.paused=!!v;
}
function trackStep(ck,gid,stepId){ /* call BEFORE the step is written into the group */
  const gs=gstate(COLLS[ck],gid);

  const r=trkTouch();r.steps++;
  if(!real){const k=ck+':'+gid;if(!r.started.includes(k))r.started.push(k);}
}
const minOf=r=>r?r.sec/60:0;
function minutesIn(a,b){const t=TRK();let s=0;Object.keys(t.days).forEach(d=>{if(d>=a&&d<=b)s+=t.days[d].sec;});return s/60;}
const dayActive=d=>{const r=TRK().days[d];return !!r&&r.sec>=ACTIVE_SEC;};
function streak(){let d=today();if(!dayActive(d))d=addDays(d,-1);let n=0;while(dayActive(d)){n++;d=addDays(d,-1);}return n;}
const shortDate=s=>parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});

/* ---- groups ---- */
function groupRows(){
  const out=[];
  ['verb','pv','noun','adj','vocab','sent'].forEach(k=>{
    const c=COLLS[k];
    c.groups.forEach(g=>{
      const gs=gstate(c,g.id),real=Object.values(gs.steps).some(r=>r&&!r.skipped);
      const complete=availability(c,g.id).every(x=>x.done),stt=groupStatus(c,g.id);
      out.push({k,c,g,n:itemsOf(c,g).length,mastered:stt.mastered,status:complete?'complete':(stt.trained?'trained':(real?'started':'none'))});
    });
  });

}
function projection(){
  const rows=groupRows(),total=rows.length,started=rows.filter(r=>r.status!=='none').length,un=total-started;
  const start=trkStart(),days=Math.max(1,diff(today(),start)+1),goal=GOAL();
  const basis=(days>=3&&started>0)?'pace':'goal';
  const pace=basis==='pace'?started/days:goal;
  let latest=null;
  rows.forEach(r=>{if(r.status==='none')return;availability(r.c,r.g.id).forEach(x=>{if(!x.done&&(!latest||x.due>latest))latest=x.due;});});
  const proj=un>0?addDays(today(),Math.ceil(un/pace)-1+LAST_START_TAIL):null;
  const finish=[latest,proj].filter(Boolean).sort().pop()||null;
  const items=rows.reduce((a,r)=>a+r.n,0),doneItems=rows.filter(r=>r.status==='complete').reduce((a,r)=>a+r.n,0);
  return {rows,total,started,un,days,basis,pace,finish,planned:Math.min(total,goal*days),complete:rows.filter(r=>r.status==='complete').length,trained:rows.filter(r=>r.status==='trained'||r.status==='complete').length,items,doneItems,start};
}

/* ================= test-item construction ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor((rnd||Math.random)()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const testCache={};
function testItems(c,gid){
  const ck=c.key+':'+gid;
  if(testCache[ck])return testCache[ck];
  const vs=itemsOf(c,gById(c,gid)),n=vs.length,nf=c.forms.length,rnd=mulberry32(gid*7919+13+(c.key==='vocab'?9973:(c.key==='noun'?4421:(c.key==='adj'?6133:(c.key==='pv'?2087:(c.key==='sent'?3359:0))))));
  const forms=shuffled(Array.from({length:n},(_,i)=>i%nf),rnd);
  const types=nf>1?shuffled(Array.from({length:n},(_,i)=>i%2),rnd):Array.from({length:n},()=>0);
  const conflicts=i=>{const inf=vs[i][0];const set=new Set([i]);c.conflicts.forEach(cf=>{if(cf.includes(inf))cf.forEach(w=>{const k=vs.findIndex(v=>v[0]===w);if(k>=0)set.add(k);});});return set;};
  const items=vs.map((v,i)=>{
    const f=forms[i];let foil;
    if(types[i]===0){const bad=conflicts(i);const cc=[];for(let j=0;j<n;j++)if(!bad.has(j))cc.push(j);foil={item:cc[Math.floor(rnd()*cc.length)],form:f};}
    else{const alt=[];for(let k=0;k<nf;k++)if(k!==f&&vs[i][k]!==vs[i][f])alt.push(k);
      if(alt.length)foil={item:i,form:alt[Math.floor(rnd()*alt.length)]};
      else{const bad=conflicts(i);const cc=[];for(let j=0;j<n;j++)if(!bad.has(j))cc.push(j);foil={item:cc[Math.floor(rnd()*cc.length)],form:f};types[i]=0;}}
    return {item:i,form:f,foil,foilType:foil.item===i?1:0,leftCorrect:rnd()<0.5};
  });
  testCache[ck]=items;return items;
}
const optLabel=(c,gid,o)=>{const v=itemsOf(c,gById(c,gid))[o.item];return {en:enOf(c,v),tag:c.forms[o.form].label};};

/* ================= pronunciation notes (spelling rules only) ================= */
function notesFor(c,entry){
  const ws=entry.slice(0,c.forms.length).map(w=>w.replace(/^(en|ett) /,'')).flatMap(w=>w.toLowerCase().split(/[\s,.!?]+/).filter(Boolean));
  const rules=[
   [/^gj|^g[eiyäö]/,'g before e, i, y, ä, ö (and gj) is pronounced like English y [j]'],
   [/^k[eiyäö]/,'k before e, i, y, ä, ö is the soft tj-sound [ɕ]'],
   [/^sj/,'sj is the Swedish sj-sound [ɧ], with no English equivalent'],
   [/^hj/,'hj is pronounced like y, the h is silent [j]'],
   [/^för.*rs|^förs/,'rs is pronounced like a single sh-like sound [ʂ]']
  ];
  return rules.map(r=>{const m=[...new Set(ws.filter(w=>r[0].test(w)))];return m.length?r[1]+': '+m.join(', ')+'.':null;}).filter(Boolean);
}

/* ---- loop focus marks (used only by the loop): 'practice more' items repeat
   extra times per lap; 'I know this' items are left out. Stored in S.marks so
   they sync and travel with the backup code. ---- */
const FOCUS_COPIES=2; /* a practice-more item plays this many times per lap */
const M=()=>{S.marks=S.marks||{};S.marks.focus=S.marks.focus||{};S.marks.known=S.marks.known||{};return S.marks;};
const mkey=it=>it.c+':'+it.e[0];
const isFocus=it=>!!M().focus[mkey(it)];
const isKnown=it=>!!M().known[mkey(it)];
function allLoopItems(){
  const src=S.settings.loopSrc,out=[];
  if(src==='deck'){deckEntries().forEach(x=>out.push({c:x.it.c,e:x.it.e}));return out;}
  Object.values(COLLS).forEach(c=>{if(src==='all'||src===c.key)c.groups.forEach(g=>itemsOf(c,g).forEach(e=>out.push({c:c.key,e})));});
  return out;
}
function loopPool(){ /* items eligible for the loop, before extra copies */
  let a=allLoopItems().filter(it=>!isKnown(it));
  if(S.settings.loopFocusOnly)a=a.filter(isFocus);
  return a;
}
function loopItems(){
  const base=loopPool();
  const extra=[];
  base.forEach(it=>{if(isFocus(it))for(let k=1;k<FOCUS_COPIES;k++)extra.push(it);});
  let out=base.concat(extra);
  if(S.settings.loopShuffle){
    out=shuffled(out);
    for(let i=1;i<out.length;i++){ /* avoid the same item twice in a row */
      if(mkey(out[i])===mkey(out[i-1])){const j=(i+1<out.length)?i+1:i-2;if(j>=0&&j<out.length)[out[i],out[j]]=[out[j],out[i]];}
    }
  }
  return out;
}

function loopMark(kind){
  if(!LP)return;
  const it=LP.items[LP.i];if(!it)return;
  const k=mkey(it),m=M();
  if(kind==='focus'){
    if(m.focus[k]){ /* undo: drop the extra copies still ahead in this lap */
      delete m.focus[k];
      for(let j=LP.items.length-1;j>LP.i;j--)if(mkey(LP.items[j])===k)LP.items.splice(j,1);
    }else{
      delete m.known[k];m.focus[k]=1;
      const ahead=LP.items.length-LP.i-1;
      for(let c2=1;c2<FOCUS_COPIES;c2++){const pos=LP.i+1+Math.floor(Math.random()*(ahead+1));LP.items.splice(pos,0,it);}
    }
    save();refreshMarkUI();
  }else{
    delete m.focus[k];m.known[k]=1;
    for(let j=LP.items.length-1;j>=0;j--){ /* remove every other copy; current one is passed over */
      if(j!==LP.i&&mkey(LP.items[j])===k){LP.items.splice(j,1);if(j<LP.i)LP.i--;}
    }
    save();loopJump(1);
  }
}
function loopHard(){

  else{const snap=deckSnap(k);const r=deckRate(it.c,it.e,snap?1:2);if(r&&r.error)return;LP.undo={key:k,snap:snap};}

}

async function loopItem(it){
  const c=COLLS[it.c],nf=c.forms.length,P=(S.settings.loopPause+(c.loopExtra||0))*1000,teach=S.settings.loopStyle==='teach';
  const ok=()=>LP&&!LP.abort&&!LP.jump;
  const wait=async ms=>{let t=0;while(ok()&&t<ms){await new Promise(r=>setTimeout(r,100));if(!(LP&&LP.paused))t+=100;}};
  const gate=async()=>{while(ok()&&LP.paused)await new Promise(r=>setTimeout(r,150));return !!ok();};
  const st=Array(nf).fill('hidden');
  $('#hudL').textContent=c.label+' · lap '+LP.lap;$('#hudR').textContent='Item '+(LP.i+1)+' of '+LP.items.length;
  setBar(LP.i/LP.items.length);
  loopShow(it,st,'Listen','hear');
  await wait(150);if(!await gate())return;
  await say(speakable(enOf(c,it.e)),'en-US');
  for(let i=0;i<nf&&ok();i++){
    if(!teach){st[i]='ask';loopShow(it,st,nf>1?'Say the '+c.forms[i].label:'Say it in Swedish','say');await wait(P);if(!await gate())return;}
    st[i]='act';loopShow(it,st,'Listen','hear');
    await say(it.e[i],'sv-SE');
    if(teach){loopShow(it,st,'Say it aloud','say');await wait(P);}else await wait(500);
    st[i]='shown';
  }
  await wait(900);
}
async function loopRun(){
  while(LP&&!LP.abort){
    const L0=LP;L0.t0=Date.now();L0.pausedMs=0;L0.pStart=0;
    await loopItem(LP.items[LP.i]);
    trackLoop(L0);
    if(!LP||LP.abort)break;
    const n=LP.items.length;
    if(LP.jump){LP.i=(LP.i+LP.jump+n)%n;LP.jump=0;}
    else if(++LP.i>=n){
      LP.i=0;LP.lap++;LP.items=loopItems();
      if(!LP.items.length){renderLoop();return;}
    }
  }
}

function howHTML(c){
  const tl=Math.round(TRIAL_LEN(c)*10)/10;

  '<p><b>Trial timing.</b> In the paper a trial lasted 4.5 s: a fixation cross for 1 s, the first-language word from 0.5 s, the translation with audio at 1.0 s for 1.5 s, then a 2 s window to repeat it. Retrieval trials swap the order: a 2 s window to say the word first, then the word and audio as feedback for 1.5 s. Tests lasted 5 s: the word shown and played at 0.5 s and two answer options from 1.0 s.</p>'+

  '<li>The test is a two-choice recognition test like the paper’s, with a Swedish '+(c.forms.length>1?'form':(c.key==='sent'?'sentence':'word'))+' on screen and two English options. '+(c.forms.length>1?'Half the wrong options are a different '+c.labelSing+' in the same form, and half are the same '+c.labelSing+' in a different form, so you need both the meaning and the form.':'Wrong options are a different '+(c.key==='sent'?'sentence':'word')+' from the same group.')+'</li>'+
  '<li>Nothing checks what you say aloud. The paper’s trials did not depend on that either, but saying it aloud is the point.</li>'+
  '<li>The 90% threshold for “Mastered” is mine. The paper does not define mastery. “Training complete” means the teaching block and all four retrieval blocks are done.</li></ul>'+
  '<p><b>Caution.</b> The study analysed 36 learners, and the words were single nouns and verbs. In exploratory analyses the benefit was clearest for high-frequency words, and low-frequency verbs benefited least, though that pattern was only marginally significant. The '+c.itemsLabel+' here are mixed difficulty, and I have not tested this tool against that pattern.</p>'+
  (c.key==='verb'?'<p><b>Verb colours.</b> The frame round the forms shows the conjugation group: '+Object.keys(CG).map(n=>'<span class="cgdot" style="background:'+CG[n].c+'"></span> '+CG[n].name).join('; ')+'. Group 4 also holds irregular verbs such as <i>vara</i>, <i>göra</i> and <i>kunna</i>.</p>':'')+

function rateReset(c,v){ /* called at the start of every retrieval or deck trial */
  if(!run||(run.kind!=='retrieval'&&run.kind!=='deck'))return;
  const k=c.key+':'+v[0],inDeck=!!DK().cards[k],deck=run.kind==='deck';
  run.cur={c:c.key,e:v,k:k,rating:0,snap:deckSnap(k)};
  $$('#ratebar .rate').forEach(b=>{b.classList.remove('sel');b.disabled=deck;});
  const m=$('#ratemsg'),f=$('#ratefoot');
  if(m)m.textContent=deck?'Say each form aloud. You rate it when the item ends.':(inDeck?'This item is in your review deck. Rate it to reschedule it.':'Optional. Again or Hard adds this item to your review deck.');

function onRate(r){
  if(!run||!run.cur)return;
  if(run.kind==='deck'){if(run.rateResolve){const f=run.rateResolve;run.rateResolve=null;f(r);}return;}
  if(run.kind!=='retrieval')return;
  const cur=run.cur;
  if(cur.rating)deckRestore(cur.k,cur.snap); /* a later tap on the same item replaces the earlier one */
  const res=deckRate(cur.c,cur.e,r);
  cur.rating=r;run.rates[cur.k]=res;
  $$('#ratebar .rate').forEach(b=>b.classList.toggle('sel',+b.dataset.r===r));
  const m=$('#ratemsg');if(m)m.textContent=rateMsg(res,r);
  const f=$('#ratefoot');if(f)f.innerHTML='';

function rateRemove(){

  const cur=run.cur;
  deckRemove(cur.k,true);cur.rating=0;run.rates[cur.k]={graduated:true,manual:true};
  $$('#ratebar .rate').forEach(b=>b.classList.remove('sel'));

const setBar=f=>{const b=$('#bar');if(b)b.style.width=Math.min(100,Math.max(0,f*100))+'%';};

function formRowsHTML(c,v,states){

/* ---------- trial builders ---------- */
function studyTrial(c,v){
  const T=TT(c),nf=c.forms.length,st=Array(nf).fill('hidden'),ev=[];
  const draw=()=>setCenter(formRowsHTML(c,v,st));
  ev.push({t:0,fn:()=>{setEn('');setCenter(fixHTML);setPrompt('');$('#notes').textContent='';}});
  ev.push({t:T.l1At,fn:()=>{setEn(enOf(c,v),emojiOf(c,v));speakEn(enOf(c,v));}});
  c.forms.forEach((f,i)=>{
    const b=T.fix+i*(T.present+T.respond);
    ev.push({t:b,fn:()=>{for(let k=0;k<nf;k++)if(st[k]==='act'||st[k]==='ask')st[k]='shown';st[i]='act';draw();setPrompt('Listen','hear');speak(v[i]);
      if(i===0){const n=notesFor(c,v);$('#notes').innerHTML=n.map(esc).join('<br>');}}});
    ev.push({t:b+T.present,fn:()=>{setPrompt('Say it aloud in Swedish','say');}});
  });
  return {dur:TRIAL_LEN(c),events:ev};
}
function retrievalTrial(c,v){
  const T=TT(c),nf=c.forms.length,st=Array(nf).fill('hidden'),ev=[];
  const draw=()=>setCenter(formRowsHTML(c,v,st));
  ev.push({t:0,fn:()=>{setEn('');setCenter(fixHTML);setPrompt('');$('#notes').textContent='';rateReset(c,v);}});
  ev.push({t:T.l1At,fn:()=>{setEn(enOf(c,v),emojiOf(c,v));speakEn(enOf(c,v));}});
  c.forms.forEach((f,i)=>{
    const b=T.fix+i*(T.present+T.respond);
    const askTxt=f.label?'Say the '+f.label+' in Swedish':'Say it in Swedish';
    ev.push({t:b,fn:()=>{for(let k=0;k<nf;k++)if(st[k]==='act')st[k]='shown';st[i]='ask';draw();setPrompt(askTxt,'say');}});
    ev.push({t:b+T.respond,fn:()=>{st[i]='act';draw();setPrompt('Listen','hear');speak(v[i]);
      if(i===0){const n=notesFor(c,v);$('#notes').innerHTML=n.map(esc).join('<br>');}}});
  });
  return {dur:TRIAL_LEN(c),events:ev};
}
function testTrial(item){
  const c=COLLS[run.coll],T=TT(c),gid=run.gid,v=itemsOf(c,gById(c,gid))[item.item],word=v[item.form];
  const corr=optLabel(c,gid,{item:item.item,form:item.form}),foil=optLabel(c,gid,item.foil);
  const L=item.leftCorrect?corr:foil,R=item.leftCorrect?foil:corr;
  const rec={item:item.item,form:item.form,resp:null,correct:false};
  run.results.push(rec);
  const trial={dur:T.testTrial,events:[],onAnswer:null,rec};
  const tagHTML=t=>t?'<small>('+t+')</small>':'';
  const opts=(sel)=>'<div class="opts2"><button class="opt2'+(sel==='L'?' sel':'')+'" data-side="L">'+esc(L.en)+tagHTML(L.tag)+'<small>←</small></button><button class="opt2'+(sel==='R'?' sel':'')+'" data-side="R">'+esc(R.en)+tagHTML(R.tag)+'<small>→</small></button></div>';
  let optionsOn=false;
  trial.events.push({t:0,fn:()=>{setEn('');setCenter(fixHTML);setPrompt('');$('#notes').textContent='';}});
  trial.events.push({t:0.5,fn:()=>{setCenter('<div class="big">'+esc(word)+'</div>');setPrompt('Choose the matching meaning','hear');speak(word);}});
  trial.events.push({t:T.testOptAt,fn:()=>{optionsOn=true;setCenter('<div class="big" style="margin-bottom:14px">'+esc(word)+'</div>'+opts(null));}});
  trial.answer=side=>{
    if(!optionsOn||rec.resp)return;
    rec.resp=side;rec.correct=(side==='L')===item.leftCorrect;
    setCenter('<div class="big" style="margin-bottom:14px">'+esc(word)+'</div>'+opts(side));
    if(S.settings.fast)ctl.skip=true;
  };
  return trial;
}

/* ---------- engine ---------- */
function playTrial(trial){
  return new Promise(resolve=>{
    let el=0,last=performance.now(),i=0;
    run.trial=trial;
    const iv=setInterval(()=>{
      if(ctl.abort){clearInterval(iv);resolve('abort');return;}
      const now=performance.now(),dt=(now-last)/1000*SPEED;last=now;
      if(!ctl.paused){el+=dt;trackTick(dt/SPEED);}
      while(i<trial.events.length&&trial.events[i].t<=el){trial.events[i].fn();i++;}
      setBar(el/trial.dur);
      if(el>=trial.dur||ctl.skip){ctl.skip=false;clearInterval(iv);resolve('done');return;}
    },1000/30/SPEED);
  });
}
function countdown(){
  return new Promise(resolve=>{
    let n=3;
    const show=()=>{setCenter('<div class="cd">'+n+'</div>');};
    setEn('');setPrompt('Get ready');show();
    const iv=setInterval(()=>{
      if(ctl.abort){clearInterval(iv);resolve('abort');return;}
      if(ctl.paused)return;
      n--;if(n<=0){clearInterval(iv);resolve('done');}else show();
    },1000/SPEED);
  });
}

  ctl={paused:false,abort:false,skip:false};
  run.idx=0;run.results=[];run.rates={};run.cur=null;run.rateResolve=null;
  rateShow(isDeck||isRet);$$('#ratebar .rate').forEach(b=>{b.disabled=true;});
  const c0=isDeck?null:COLLS[run.coll];
  $('#hudL').textContent=isDeck?'Review deck':c0.label+', group '+run.gid;
  if((await countdown())==='abort')return;
  for(let i=0;i<run.trials.length;i++){
    run.idx=i;
    $('#hudR').textContent='Item '+(i+1)+' of '+run.trials.length;
    const item=run.trials[i];
    let trial,c=c0;
    if(isDeck){c=COLLS[item.c];trial=retrievalTrial(c,item.e);$('#hudL').textContent='Review, '+c.label.toLowerCase();}
    else if(run.kind==='study')trial=studyTrial(c,itemsOf(c,gById(c,run.gid))[item]);
    else if(run.kind==='retrieval')trial=retrievalTrial(c,itemsOf(c,gById(c,run.gid))[item]);
    else trial=testTrial(item);
    const r=await playTrial(trial);
    trackFlush();
    if(r==='abort'||ctl.abort)return;
    if(isDeck){
      const g=await askRating();
      if(g===null||ctl.abort)return;
      let res;
      if(g==='remove'){deckRemove(item.k,true);res={graduated:true,manual:true};}
      else res=deckRate(item.c,item.e,g);
      trkTouch().deck++;
      run.results.push({k:item.k,c:item.c,e:item.e,g:g,res:res});
    }
  }
  try{speechSynthesis.cancel();}catch(e){}
  rateShow(false);
  trackFlush();save();
  finishRun();
}
function stopRun(){trackFlush();ctl.abort=true;releaseWake();stopLoop();try{speechSynthesis.cancel();}catch(e){}
  if(run&&run.rateResolve){const f=run.rateResolve;run.rateResolve=null;f(null);}}

/* ---------- start / finish ---------- */
function makeRun(collKey,gid,kind,stepId,extra){
  const c=COLLS[collKey],n=itemsOf(c,gById(c,gid)).length;
  let trials;
  if(kind==='test')trials=shuffled(testItems(c,gid));
  else trials=shuffled(Array.from({length:n},(_,i)=>i));
  run={coll:collKey,gid,kind,stepId,extra,trials,results:[]};
}
function finishRun(){
  if(run.kind==='deck'){finishDeckRun();return;}
  releaseWake();
  const c=COLLS[run.coll],gid=run.gid,g=gById(c,gid);
  const nextStepHTML=()=>{
    const av=availability(c,gid),nx=av.find(x=>!x.done);
    if(!nx)return '<p>All steps in this group are done.</p>';
    if(nx.ready)return '<p>Next: <b>'+nx.st.label+'</b> is ready now.</p>';
    return '<p>Next: <b>'+nx.st.label+'</b>, planned for <b>'+nice(nx.due)+'</b>.</p>';
  };
  let body='';
  if(run.kind==='test'){
    const total=run.results.length,correct=run.results.filter(r=>r.correct).length,pct=correct/total;
    const missed=run.results.filter(r=>!r.correct).map(r=>({item:r.item,form:r.form}));
    if(run.stepId&&!run.extra){trackStep(c.key,gid,run.stepId);gstate(c,gid).steps[run.stepId]={date:today(),correct,total,pct,missed};save();}
    const msg=pct>=MASTER?'Excellent':(pct>=0.7?'Good':'Keep going');
    body='<div class="pen"><b>'+correct+'/'+total+'</b><svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C 25 1, 60 9, 98 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><em>'+msg+'</em></div>'+
      '<p>'+Math.round(pct*100)+'% correct.'+(run.extra?' This was extra practice, so it is not saved to the schedule.':'')+'</p>';
    if(run.stepId==='t2'&&!run.extra)body+='<p>'+(pct>=MASTER?'That is at or above your 90% mastery threshold, so <b>Group '+gid+' is now marked as mastered</b>.':'That is below the 90% mastery threshold. You can start this group over, or use extra practice on the items you missed.')+'</p>';
    if(missed.length)body+='<p style="margin-bottom:0"><b>Missed</b></p><ul class="miss">'+missed.map(m=>{const v=itemsOf(c,g)[m.item];const tag=c.forms[m.form].label;return '<li><span class="sv">'+esc(v[m.form])+'</span>'+(tag?' ('+tag+')':'')+': '+esc(enOf(c,v))+'</li>';}).join('')+'</ul>';
    else body+='<p>You got every item right.</p>';
  }else{
    if(run.stepId&&!run.extra){trackStep(c.key,gid,run.stepId);gstate(c,gid).steps[run.stepId]={date:today()};save();}
    body='<p>'+(run.kind==='study'?'Teaching':'Retrieval')+' block finished: '+run.trials.length+' '+c.itemsLabel+'.'+(run.extra?' This was extra practice, so it is not saved to the schedule.':'')+'</p>'+retNote();
  }
  let btns='';
  if(!run.extra&&run.stepId==='study')btns+='<button class="btn primary" data-act="step" data-c="'+c.key+'" data-g="'+gid+'" data-s="r1">Continue to the retrieval block</button> ';
  btns+='<button class="btn'+(btns?'':' primary')+'" data-act="home" data-c="'+c.key+'">Back to groups</button>';
  view={name:'result',coll:c.key};
  app().innerHTML='<div style="'+lineVar(c.key)+'"><div class="sech"><h1>Group '+gid+' finished</h1><p>'+esc(c.label)+'</p></div><div class="panel res"><div class="in" style="padding-top:18px">'+body+rewardNote()+(run.extra?'':nextStepHTML())+'<p>'+btns+'</p></div></div></div>';
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const side=e.target.closest('[data-side]');
  if(side&&run&&run.trial&&run.trial.answer){run.trial.answer(side.dataset.side);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,ck=b.dataset.c,gid=+b.dataset.g;
  if(act==='menu'){stopLoop();renderMenu();}
  else if(act==='settings'){renderSettings();}
  else if(act==='resetAll'){armBtn(b,()=>{resetAll();},'Tap again to erase everything');}
  else if(act==='progressTab'){stopRun();renderProgress();}
  else if(act==='rewardSave'){rewardSave();}
  else if(act==='rewardEdit'){rwEdit=b.dataset.id;renderProgress(true);const f=$('#rwText');if(f){f.scrollIntoView({block:'center'});f.focus();}}
  else if(act==='rewardCancel'){rwEdit=null;renderProgress(true);}
  else if(act==='rewardDelete'){armBtn(b,()=>{const t=TRK();t.rewards=t.rewards.filter(r=>r.id!==b.dataset.id);if(rwEdit===b.dataset.id)rwEdit=null;save();renderProgress(true,'Reward removed.');},'Tap again to remove');}
  else if(act==='rewardClaim'){const r=TRK().rewards.find(x=>x.id===b.dataset.id);if(r){r.claimed=today();save();renderProgress(true,'Claimed: '+r.label+'. Enjoy it.');}}
  else if(act==='trkClear'){armBtn(b,()=>{TRK().days={};trkPending=0;save();renderProgress(true,'History cleared.');},'Tap again to clear');}
  else if(act==='hardTab'||act==='deckHome'){stopRun();renderDeck();}
  else if(act==='deckStart'){deckStart();}
  else if(act==='deckAllToggle'){deckAll=!deckAll;renderDeck(null,true);}
  else if(act==='deckRemove'){deckRemove(b.dataset.k,true);renderDeck(null,true);}
  else if(act==='deckGrad'){masteredCards().forEach(x=>deckRemove(x.k,true));renderDeck('Removed the mastered cards.',true);}
  else if(act==='clearHard'){armBtn(b,()=>{DK().cards={};save();renderDeck('Cleared all hard items.',true);});}
  else if(act==='clearSkipped'){armBtn(b,()=>{M().known={};save();renderDeck('Cleared all skipped items.',true);});}
  else if(act==='rate'){onRate(+b.dataset.r);}
  else if(act==='rateRemove'){rateRemove();}
  else if(act==='mkHard'){loopHard();}
  else if(act==='coll'){stopLoop();renderHome(ck);window.scrollTo(0,0);}
  else if(act==='loopTab'){renderLoop();}
  else if(act==='loopStart'){loopStart();}
  else if(act==='loopStop'){renderLoop();}
  else if(act==='loopPrev'){loopJump(-1);}
  else if(act==='loopNext'){loopJump(1);}
  else if(act==='mkFocus'){loopMark('focus');}
  else if(act==='mkKnown'){loopMark('known');}
  else if(act==='unmark'){delete M()[b.dataset.kind][b.dataset.k];save();if(view.name==='deck')renderDeck(null,true);else renderLoop(null,true);}
  else if(act==='clearMarks'){
    if(b.dataset.armed){M()[b.dataset.kind]={};save();if(view.name==='deck')renderDeck(null,true);else renderLoop(null,true);}
    else{b.dataset.armed='1';const old=b.textContent;b.textContent='Tap again to clear all';setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=old;}},4000);}
  }
  else if(act==='loopPause'&&LP){loopSetPaused(!LP.paused);b.textContent=LP.paused?'Resume':'Pause';}
  else if(act==='step'){
    const st=STEPS.find(s=>s.id===b.dataset.s);
    makeRun(ck,gid,st.kind,st.id,false);renderInstr();window.scrollTo(0,0);
  }else if(act==='skip'){
    gstate(COLLS[ck],gid).steps[b.dataset.s]={date:today(),skipped:true};save();renderHome(ck);
  }else if(act==='extra'){
    makeRun(ck,gid,b.dataset.k,null,true);renderInstr();window.scrollTo(0,0);
  }else if(act==='begin'){startRun();}
  else if(act==='home'){stopRun();renderHome(ck||view.coll);}
  else if(act==='pause'){ctl.paused=!ctl.paused;b.textContent=ctl.paused?'Resume':'Pause';if(ctl.paused){try{speechSynthesis.cancel();}catch(e){}}}
  else if(act==='quit'){
    if(b.dataset.armed){const wasDeck=run&&run.kind==='deck',cc=run?run.coll:view.coll;stopRun();if(wasDeck)renderDeck();else renderHome(cc);}
    else{b.dataset.armed='1';b.textContent='Confirm quit (progress not saved)';ctl.paused=true;$('#pauseB').textContent='Resume';}
  }
  else if(act==='reset'){
    if(b.dataset.armed){delete S[ck].groups[gid];save();renderHome(ck);}
    else{b.dataset.armed='1';b.textContent='Click again to erase this group’s progress';}
  }
});
document.addEventListener('keydown',e=>{
  if(view.name!=='run')return;
  if(e.key===' '&&!e.target.closest('button')){e.preventDefault();$('#pauseB').click();}
  else if(e.key==='Escape'){$('#quitB').click();}
  else if(run&&(run.kind==='retrieval'||run.kind==='deck')&&/^[1-4]$/.test(e.key)){e.preventDefault();onRate(+e.key);}
  else if(run&&run.trial&&run.trial.answer){
    if(e.key==='ArrowLeft'||e.key==='1'){e.preventDefault();run.trial.answer('L');}
    else if(e.key==='ArrowRight'||e.key==='2'){e.preventDefault();run.trial.answer('R');}
  }
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(view.name==='run'||view.name==='loop')&&S.settings.wake)requestWake();});
document.addEventListener('change',e=>{
  if(e.target.id==='audioOn'){S.settings.audio=e.target.checked;save();loadVoices();}
  else if(e.target.id==='voice'){S.settings.voice=e.target.value;save();}
  else if(e.target.id==='rate'){S.settings.rate=parseFloat(e.target.value)||1;save();}
  else if(e.target.id==='fastNext'){S.settings.fast=e.target.checked;save();}
  else if(e.target.id==='enAudio'){S.settings.enAudio=e.target.checked;save();}
  else if(e.target.id==='wakeOn'){S.settings.wake=e.target.checked;save();if(!e.target.checked)releaseWake();}
  else if(e.target.id==='dailyGoal'){S.settings.dailyGoal=parseInt(e.target.value,10)||3;save();renderProgress(true);}
  else if(e.target.id==='trkStart'){const v=e.target.value;if(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(v)){TRK().start=v;save();renderProgress(true,'Start date updated.');}}
  else if(e.target.id==='deckRetention'){S.settings.deckRetention=parseFloat(e.target.value)||0.9;save();}
  else if(e.target.id==='deckGrad'){const v=parseInt(e.target.value,10);S.settings.deckGrad=isNaN(v)?30:v;save();}
  else if(e.target.id==='loopSrc'){S.settings.loopSrc=e.target.value;save();}
  else if(e.target.id==='loopStyle'){S.settings.loopStyle=e.target.value;save();}
  else if(e.target.id==='loopPause'){S.settings.loopPause=parseFloat(e.target.value)||2;save();}
  else if(e.target.id==='loopShuffle'){S.settings.loopShuffle=e.target.checked;save();}
  else if(e.target.id==='loopFocusOnly'){S.settings.loopFocusOnly=e.target.checked;save();}
});
document.addEventListener('click',e=>{
  if(e.target.id==='voiceTest'){unlockAudio();speak('arbetar');}
  else if(e.target.id==='codeCopy'){
    const code=backupCode(),msg=$('#codeMsg');
    const done=()=>{if(msg){msg.textContent='Copied.';setTimeout(()=>{if(msg.textContent==='Copied.')msg.textContent='';},3000);}};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(done).catch(()=>{$('#codeIn').value=code;if(msg)msg.textContent='Could not use the clipboard. The code is in the box below, so copy it manually.';});
    else{$('#codeIn').value=code;if(msg)msg.textContent='The code is in the box below, so copy it manually.';}
  }else if(e.target.id==='codeRestore'){
    const v=$('#codeIn').value,msg=$('#codeMsg');
    if(!v.trim()){if(msg)msg.textContent='Paste a code first.';return;}
    if(restoreFromCode(v)){if(msg)msg.textContent='Restored.';setTimeout(()=>renderHome(view.coll),900);}
    else if(msg)msg.textContent='That code did not look right.';
  }
});

renderMenu();
initCloud();
window.__debug={get run(){return run;},get view(){return view;},get S(){return S;}};

</script>
